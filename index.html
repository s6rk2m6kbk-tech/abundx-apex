   ${SJ.filter(s=>s!=='Other').map(s=>`<div class="card"><div class="sub">${esc(s)}</div><div class="big">${open.filter(x=>x.subject===s).length}</div><div class="sub">${T.filter(x=>x.subject===s&&x.status==='Mastered').length} mastered</div></div>`).join('')}</div>
  <div class="card"><h3>${editWT?'Edit weak topic':'Add a weak topic'}</h3><form onsubmit="saveWT(event)">
   <div class="row"><div><label>Class</label>${sel('wcl',WT_CLS,e0.cls||wkF.cls||'Class 11')}</div><div><label>Subject</label>${sel('wsu',SJ,eSub,'onchange="wtAreaFill(\'\')"')}</div>
    <div><label>Area</label><select id="war"><option value="">(no area)</option>${wtAreas(eSub).map(a=>`<option ${a.name===e0.area?'selected':''}>${esc(a.name)}</option>`).join('')}</select></div><div><label>Priority</label>${sel('wpr',WT_PR,e0.priority||'Medium')}</div></div>
   <div class="row"><div style="grid-column:span 2"><label>Topic</label><input id="wto" required value="${esc(e0.topic||'')}" placeholder="e.g. Circle: tangents and normals"></div><div><label>Status</label>${sel('wst',WT_ST,e0.status)}</div><div><label>Accuracy % (optional)</label><input id="wac" type="number" min="0" max="100" value="${e0.accuracy??''}"></div></div>
   <div class="row"><div style="grid-column:span 2"><label>Book (blank = the area's book)</label><input id="wbk" value="${esc(e0.book||'')}"></div><div style="grid-column:span 2"><label>What goes wrong (optional)</label><input id="wno" value="${esc(e0.notes||'')}" placeholder="e.g. sign mistakes, formula not remembered"></div></div>
   <button class="btn ok">${editWT?'Update':'Add weak topic'}</button> ${editWT?'<button type="button" class="btn alt" onclick="editWT=null;vWeak()">Cancel</button>':''}</form></div>
  <div class="card"><div style="margin-bottom:6px"><span class="sub">Class:</span> ${chip('cls','','All')} ${WT_CLS.map(c=>chip('cls',c,c)).join(' ')}</div>
   <div style="margin-bottom:6px"><span class="sub">Subject:</span> ${chip('sub','','All')} ${SJ.map(c=>chip('sub',c,c)).join(' ')}</div>
   <div class="row"><div><label>Show</label><select onchange="wkF.st=this.value;vWeak()">${[['open','Still weak (not mastered)'],['all','All'],...WT_ST.map(x=>[x,x])].map(([k,l])=>`<option value="${k}" ${wkF.st===k?'selected':''}>${l}</option>`).join('')}</select></div>
    <div style="grid-column:span 2"><label>Search</label><input id="wkq" type="search" value="${esc(wkF.q)}" placeholder="Search topics, areas, books, notes..." oninput="wkF.q=this.value;document.getElementById('wkList').innerHTML=wtList()"></div></div></div>
  <div id="wkList">${wtList()}</div>
  <div class="card"><h3>Areas and books</h3><div class="sub" style="margin-bottom:8px">Each area has its own book. Change the book, rename, add or remove areas here.</div>
   ${SJ.filter(sj=>sj!=='Other').map(sj=>`<div style="margin:12px 0 4px"><b style="color:${SUBJ_COL[sj]||INK()}">${esc(sj)}</b></div><div class="tw"><table><tr><th>Area</th><th>Book</th><th>Progress</th><th></th></tr>${wtAreas(sj).map(a=>`<tr><td><b>${esc(a.name)}</b></td><td><input value="${esc(a.book||'')}" placeholder="Set the book" onchange="areaBookSet('${a.id}',this.value)" style="min-width:150px"></td><td class="sub">${stat(sj,a.name)}</td><td style="white-space:nowrap"><button class="btn s alt" onclick="areaRename('${a.id}')">Rename</button> <button class="btn s bad" onclick="areaDel('${a.id}')">×</button></td></tr>`).join('')||'<tr><td colspan=4 class="sub">No areas yet.</td></tr>'}</table></div>`).join('')}
   <form onsubmit="areaAdd(event)" style="margin-top:12px"><div class="row"><div><label>Subject</label>${sel('asu',SJ.filter(sj=>sj!=='Other'),SJ[0])}</div><div><label>New area name</label><input id="anm" required placeholder="e.g. Thermodynamics"></div><div><label>Book</label><input id="abk"></div></div><button class="btn ok">Add area</button></form></div>`;
}
function saveWT(e){
  e.preventDefault();if(!Array.isArray(S.weakTopics))S.weakTopics=[];
  const old=editWT?S.weakTopics.find(x=>x.id===editWT):null,ac=n('wac');
  if(ac!=null&&(ac<0||ac>100))return alert('Accuracy 0-100.');
  const o={id:old?old.id:wtNewId(),cls:v('wcl'),subject:v('wsu'),area:v('war'),topic:v('wto').trim(),book:v('wbk').trim(),status:v('wst'),priority:v('wpr'),accuracy:ac,notes:v('wno').trim(),added:old?old.added:today()};
  if(!o.topic)return;
  if(old)Object.assign(old,o);else S.weakTopics.push(o);
  editWT=null;save();vWeak();
}
function wtStatus(id,s){const x=S.weakTopics.find(t=>t.id===id);if(x){x.status=s;if(s==='Mastered'&&!x.masteredOn)x.masteredOn=today();if(s!=='Mastered')x.masteredOn=null;save();vWeak()}}
function wtDup(id){const x=S.weakTopics.find(t=>t.id===id);if(!x)return;S.weakTopics.push({...x,id:wtNewId(),added:today()});save();vWeak()}
function wtDel(id){const x=S.weakTopics.find(t=>t.id===id);if(x&&confirm('Delete "'+x.topic+'"?')){S.weakTopics=S.weakTopics.filter(t=>t.id!==id);save();vWeak()}}
const areaNewId=()=>'AR'+String((S.areas||[]).reduce((m,a)=>Math.max(m,+String(a.id).slice(2)||0),0)+1).padStart(3,'0');
function areaBookSet(id,val){const a=S.areas.find(x=>x.id===id);if(a){a.book=val.trim();save();vWeak()}}
function areaAdd(e){e.preventDefault();const sj=v('asu'),nm=v('anm').trim();if(!nm)return;if(S.areas.some(a=>a.subject===sj&&a.name.toLowerCase()===nm.toLowerCase()))return alert('That area already exists.');S.areas.push({id:areaNewId(),subject:sj,name:nm,book:v('abk').trim()});save();vWeak()}
function areaRename(id){const a=S.areas.find(x=>x.id===id);if(!a)return;const nm=(prompt('New name for this area:',a.name)||'').trim();if(!nm||nm===a.name)return;S.weakTopics.forEach(x=>{if(x.subject===a.subject&&x.area===a.name)x.area=nm});a.name=nm;save();vWeak()}
function areaDel(id){const a=S.areas.find(x=>x.id===id);if(!a)return;const n=S.weakTopics.filter(x=>x.subject===a.subject&&x.area===a.name).length;if(confirm('Remove the area "'+a.name+'"?'+(n?' Its '+n+' topic(s) are kept but will show as "No area".':''))){S.areas=S.areas.filter(x=>x.id!==id);save();vWeak()}}

/* ---------- ANALYTICS ---------- */
function vAnalytics(){
  const W=allWeeks(),t=today(),cw=weekStats(mon(t)),mo=logs().filter(l=>l.date.slice(0,7)===t.slice(0,7)),ms=mocks();
  const moQ=sum(mo.map(qTot)),moAcc=wAcc(mo);
  const wavg=W.length?avg(W.map(w=>w.q)):null;
  let proj='—';
  if(ms.length>=2){const x=ms.map(m=>diff(ms[0].date,m.date)),y=ms.map(m=>m.marks),mx=avg(x),my=avg(y);const den=sum(x.map(a=>(a-mx)**2));
    if(den>0){const sl=sum(x.map((a,i)=>(a-mx)*(y[i]-my)))/den;const dd=diff(ms[0].date,S.settings.milestones[S.settings.milestones.length-1].date);proj=Math.min(MAXM,Math.round(my+sl*(dd-mx)))+' (linear fit of mocks → plan end)'}}
  $('#app').innerHTML=`<h2>Analytics</h2>
  <div class="grid"><div class="card"><h3>This week</h3><div class="big">${cw.q} Q</div><div class="sub">Accuracy ${cw.acc==null?'—':r1(cw.acc)+'%'} · sleep ${r1(cw.sleep)} h · energy ${r1(cw.energy)}</div></div>
   <div class="card"><h3>This month</h3><div class="big">${moQ} Q</div><div class="sub">Accuracy ${moAcc==null?'—':r1(moAcc)+'%'} · ${mo.length} days logged</div></div>
   <div class="card"><h3>Overall</h3><div class="big">${r0(wavg)} Q/wk</div><div class="sub">Accuracy ${overallAcc()==null?'—':r1(overallAcc())+'%'}<br>Projected marks: ${proj}</div></div></div>
  <div class="grid2"><div class="card"><h3>Weekly Q (actual vs target)</h3>${sc('ca1')}</div><div class="card"><h3>Weekly accuracy %</h3>${sc('ca2')}</div>
   <div class="card"><h3>Marks vs phase targets</h3>${sc('ca3')}</div><div class="card"><h3>Avg sleep per week (target 7 h)</h3>${sc('ca4')}</div>
   <div class="card"><h3>Source mix — this week</h3>${cv('ca5')}</div><div class="card"><h3>Cumulative Q by source per phase</h3>${cv('ca6')}</div>
   <div class="card"><h3>Mock score trend</h3>${sc('ca7')}</div>
   <div class="card" style="grid-column:1/-1"><h3>My marks vs MSTR (Strategy Inc) share price</h3>${sc('ca8',300)}<div class="sub" id="mstrNote" style="margin-top:12px;line-height:1.7"></div></div>
   <div class="card"><h3>Energy heatmap (last 8 weeks)</h3><div class="sub">Mon → Sun · green ≥7, orange 5–6, red &lt;5, grey = no log</div><div class="hm" style="margin-top:6px">${heat()}</div></div></div>`;
  weekQChart('ca1');
  stock('ca2',{unit:'%',dec:1,series:[{name:'Accuracy',pts:W.filter(w=>w.acc!=null).map(w=>({t:tms(w.key),y:w.acc,meta:w.q+' Q'}))}]});
  marksChart('ca3');
  stock('ca4',{unit:' h',dec:1,series:[{name:'Avg sleep',pts:W.filter(w=>w.sleep!=null).map(w=>({t:tms(w.key),y:w.sleep}))},{name:'Target 7 h',color:'var(--ok)',dash:true,pts:W.map(w=>({t:tms(w.key),y:7}))}]});
  const names={pager:'Claude',pyq:'PYQ book',textbook:'Core books',coaching:'Class questions'};
  mk('ca5',{type:'pie',data:{labels:Object.values(names),datasets:[{data:Object.keys(names).map(k=>cw.src[k]),backgroundColor:Object.keys(names).map(k=>COL[k])}]}});
  const ph=S.settings.phases;
  mk('ca6',{type:'bar',data:{labels:ph.map(p=>p.name),datasets:Object.keys(names).map(k=>({label:names[k],backgroundColor:COL[k],data:ph.map(p=>sum(logs().filter(l=>l.date>=p.start&&l.date<=p.end).map(l=>l[k]||0)))}))},options:{scales:{x:{stacked:true},y:{stacked:true}}}});
  marksChart('ca7',true);
  mstrChart('ca8');
}
function heat(){
  const s=addD(mon(today()),-49);let h='';
  for(let i=0;i<56;i++){const d=addD(s,i),l=S.logs[d],e=l?l.energy:null;
    h+=`<div title="${fmtS(d)}${l?': energy '+e:''}" style="background:${e==null?'var(--nolog)':e>=7?'#3ddc97':e>=5?'#ffb020':'#ff5a52'};${d>today()?'opacity:.3':''}">${e??''}</div>`}
  return h;
}

/* ---------- REPORTS ---------- */
let repWeek=mon(today());
function vReports(){
  const ws=[...new Set([mon(today()),...Object.keys(S.logs).map(mon)])].sort().reverse();
  const {w,prev,grp,ms,flags,recs}=weekData(repWeek),st=S.settings;
  const row=(lab,k)=>{const [a,b,c]=grp(k);return `<tr><td>${lab}</td><td>${a}</td><td>${b}</td><td>${c}</td><td><b>${w.src[k]}</b></td><td>${w.q?r0(w.src[k]/w.q*100):0}%</td></tr>`};
  const arrow=(a,b)=>a==null||b==null?'—':a-b>1?'↑':a-b<-1?'↓':'→';
  $('#app').innerHTML=`<h2>Reports</h2>
  <div class="tools noprint"><select onchange="repWeek=this.value;vReports()">${ws.map(k=>`<option value="${k}" ${k===repWeek?'selected':''}>Week of ${fmt(k)}${isLocked(k)?' 🔒':''}</option>`).join('')}</select>
   <button class="btn ok" onclick="weeklyPdf(repWeek)">Download PDF</button><button class="btn alt" onclick="window.print()">Print</button><button class="btn alt" onclick="csv('logs')">CSV: logs</button><button class="btn alt" onclick="csv('mocks')">CSV: mocks</button><button class="btn alt" onclick="csv('backlog')">CSV: backlog</button></div>
  <div class="card"><h3>Weekly report — ${fmt(repWeek)} to ${fmt(addD(repWeek,6))}</h3>
  <div class="grid" style="grid-template-columns:repeat(auto-fit,minmax(150px,1fr))">
   <div><div class="sub">Questions</div><div class="big">${w.q}</div><div class="sub">target ${st.weeklyMin}–${st.weeklyMax}</div></div>
   <div><div class="sub">Accuracy ${arrow(w.acc,prev.acc)}</div><div class="big">${w.acc==null?'—':r1(w.acc)+'%'}</div></div>
   <div><div class="sub">Energy ${arrow(w.energy,prev.energy)}</div><div class="big">${r1(w.energy)}</div></div>
   <div><div class="sub">Sleep ${arrow(w.sleep,prev.sleep)}</div><div class="big">${r1(w.sleep)} h</div></div>
   <div><div class="sub">Mock</div><div class="big">${ms.length?ms.map(m=>m.marks).join(', '):'—'}</div></div></div>
  <div class="tw"><table><tr><th>Source</th><th>Mon–Fri</th><th>Sat</th><th>Sun</th><th>Total</th><th>% weekly</th></tr>${row('Claude','pager')}${row('PYQ book','pyq')}${row('Core books','textbook')}${row('Class questions','coaching')}
   <tr><td><b>TOTAL</b></td><td></td><td></td><td></td><td><b>${w.q}</b> / ${st.weeklyMin}–${st.weeklyMax}</td><td>100%</td></tr></table></div>
  <h3 style="margin-top:14px">Red flags</h3>${flags.length?flags.map(f=>`<div class="alert r">${esc(f)}</div>`).join(''):'<div class="sub">None 🎉</div>'}
  <h3 style="margin-top:10px">Recommended actions</h3><ul>${recs.map(r=>`<li>${esc(r)}</li>`).join('')}</ul>
  <div class="sub">Milestones this week: ${st.milestones.filter(m=>m.date>=repWeek&&m.date<=addD(repWeek,6)).map(m=>m.marks+'+ on '+fmtS(m.date)).join(', ')||'none'}</div></div>`;
}
function csv(kind){
  const rows=kind==='logs'?logs():kind==='mocks'?mocks():S.backlog;
  if(!rows.length)return alert('Nothing to export.');
  const keys=[...new Set(rows.flatMap(Object.keys))];
  const c=x=>{x=x==null?'':String(x);return /[",\n]/.test(x)?'"'+x.replace(/"/g,'""')+'"':x};
  dl(kind+'.csv',[keys.join(','),...rows.map(r=>keys.map(k=>c(r[k])).join(','))].join('\n'),'text/csv');
}
function dl(name,text,type){const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([text],{type}));a.download=name;a.click()}

/* ---------- SETTINGS ---------- */
function vSettings(){
  const s=S.settings;
  $('#app').innerHTML=`<h2>Settings</h2>
  <div class="card"><h3>Profile photo</h3><div class="sub" style="margin-bottom:10px">Shown in the top bar. It is shrunk and saved only in this browser on this device. It is never uploaded, so nobody else can see it. Do this once on each device you use.</div><div id="photoBox">${photoCard()}</div></div>
  <div class="card"><h3>Locked constraints</h3><div class="sub">Sleep 11:30 PM–6:30 AM (7 h) · Coaching 9 AM–3 PM Mon–Fri · Study 4:30–11:30 PM · 400-day target ~50,000–55,000 Q. These are fixed and not editable.</div></div>
  <form class="card" onsubmit="saveSettings(event)"><h3>Editable parameters</h3>
   <div class="row"><div><label>Plan start</label><input id="s0" type="date" value="${s.start}"></div><div><label>Exam date</label><input id="s1" type="date" value="${s.exam}"></div>
    <div><label>Weekly Q min</label><input id="s2" type="number" value="${s.weeklyMin}"></div><div><label>Weekly Q max</label><input id="s3" type="number" value="${s.weeklyMax}"></div><div><label>Baseline marks at start</label><input id="s4" type="number" value="${s.baseline}"></div></div>
   <h3>Phases</h3>${s.phases.map((p,i)=>`<div class="row"><div><label>Name</label><input id="pn${i}" value="${esc(p.name)}"></div><div><label>Start</label><input id="ps${i}" type="date" value="${p.start}"></div><div><label>End</label><input id="pe${i}" type="date" value="${p.end}"></div><div><label>Target marks</label><input id="pt${i}" type="number" value="${p.target}"></div><div><label>Focus</label><input id="pf${i}" value="${esc(p.focus)}"></div></div>`).join('')}
   <h3>Milestones</h3><div class="row" style="grid-template-columns:repeat(auto-fill,minmax(210px,1fr))">${s.milestones.map((m,i)=>`<div style="display:flex;gap:6px"><input id="md${i}" type="date" value="${m.date}"><input id="mm${i}" type="number" value="${m.marks}" style="width:80px"></div>`).join('')}</div>
   <div class="chk" style="padding:0 0 10px"><input type="checkbox" id="sul" ${s.unlockPast?'checked':''}><label for="sul">Allow editing locked weeks (normally locks Sunday 11:30 PM)</label></div>
   <button class="btn ok">Save settings</button></form>
  <div class="card"><h3>Data</h3><div class="tools"><button class="btn" onclick="dl('abundx-apex-backup-'+today()+'.json',JSON.stringify(S,null,1),'application/json')">Download backup (JSON)</button>
   <button class="btn alt" onclick="$('#imp').click()">Restore from backup</button><input id="imp" type="file" accept=".json" hidden onchange="restore(this)">
   <button class="btn bad" onclick="if(confirm('Delete ALL data in this browser?')&&confirm('Really? This cannot be undone.')){S=DEF();save();go('dashboard')}">Erase all data</button></div>
   <div class="sub">Data lives in this browser's localStorage only. Download a backup regularly — clearing site data deletes it.</div></div>${qBackup()?`
  <div class="card"><h3>Cleared question data</h3><div class="sub">All question counts were cleared on this device (23 Nov 2026). The old numbers are kept here: ${qBackup().days} day(s) and ${qBackup().weeks} weekly total(s).</div>
   <p><button class="btn alt" onclick="restoreQ()">Put the old question numbers back</button></p></div>`:''}`;
}
function qBackup(){try{const b=JSON.parse(localStorage.getItem(KEY+'_questions_backup')||'null');if(!b)return null;const C=['coaching','pager','textbook','pyq'];return{b,days:Object.values(b.logs||{}).filter(l=>C.some(c=>(l[c]||0)>0)).length,weeks:Object.keys(b.weekQ||{}).length}}catch(e){return null}}
function restoreQ(){
  const q=qBackup();if(!q)return;
  if(!confirm('Put back the old question numbers? Days you have logged since then are kept as they are.'))return;
  for(const [d,l] of Object.entries(q.b.logs||{})){if(!S.logs[d])S.logs[d]=l;else if(qTot(S.logs[d])===0)['coaching','pager','textbook','pyq'].forEach(c=>S.logs[d][c]=l[c]||0)}
  S.weekQ=Object.assign({},q.b.weekQ||{},S.weekQ||{});
  save();alert('Old question numbers restored.');go('dashboard');
}
function saveSettings(e){
  e.preventDefault();const s=S.settings;
  const P=s.phases.map((p,i)=>({...p,name:v('pn'+i),start:v('ps'+i),end:v('pe'+i),target:n('pt'+i),focus:v('pf'+i)}));
  for(const p of P)if(!p.start||!p.end||p.start>p.end)return alert(p.name+': invalid dates.');
  s.phases=P;s.start=v('s0');s.exam=v('s1');s.weeklyMin=n('s2');s.weeklyMax=n('s3');s.baseline=n('s4');s.unlockPast=$('#sul').checked;
  s.milestones=s.milestones.map((m,i)=>({date:v('md'+i),marks:n('mm'+i)})).sort((a,b)=>a.date<b.date?-1:1);
  save();alert('Saved.');render();
}
function restore(inp){
  const f=inp.files[0];if(!f)return;const r=new FileReader();
  r.onload=()=>{try{const o=JSON.parse(r.result);if(!o.logs||!o.settings)throw Error('not a tracker backup');if(!confirm('Replace current data with this backup?'))return;S={...DEF(),...o,settings:{...DEF().settings,...o.settings},clearQ1:true};save();go('dashboard')}catch(e){alert('Invalid backup: '+e.message)}};
  r.readAsText(f);
}

render();
</script>
