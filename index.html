<style>
:root{--pri:#f0f0fa;--ok:#3ddc97;--warn:#ffb020;--bad:#ff5a52;--bg:#000;--card:rgba(255,255,255,.035);--tx:#f0f0fa;--mut:#8a8f98;--line:rgba(255,255,255,.14);--line2:rgba(255,255,255,.3);--blue:#5aa9ff;--purple:#b388ff;
  --navbg:rgba(0,0,0,.72);--ov0:rgba(255,255,255,.01);--ov2:rgba(255,255,255,.06);--ov3:rgba(255,255,255,.1);--track:rgba(255,255,255,.12);--field:rgba(255,255,255,.04);--fieldf:rgba(255,255,255,.07);--hover:rgba(255,255,255,.025);--btnb:rgba(255,255,255,.7);--optbg:#111;--chartbg:#0b0b0c;--nolog:#2a2d31;--glow:rgba(90,169,255,.16);color-scheme:dark}
:root[data-theme=light]{--pri:#0d0f12;--ok:#0b9a62;--warn:#c27803;--bad:#d93a32;--bg:#f3f4f6;--card:#fff;--tx:#0d0f12;--mut:#5d636c;--line:rgba(0,0,0,.13);--line2:rgba(0,0,0,.32);--blue:#1d6fd6;--purple:#7c4dff;
  --navbg:rgba(243,244,246,.8);--ov0:rgba(0,0,0,.01);--ov2:rgba(0,0,0,.045);--ov3:rgba(0,0,0,.07);--track:rgba(0,0,0,.1);--field:rgba(0,0,0,.035);--fieldf:rgba(0,0,0,.06);--hover:rgba(0,0,0,.03);--btnb:rgba(0,0,0,.7);--optbg:#fff;--chartbg:#ffffff;--nolog:#d9dce1;--glow:rgba(29,111,214,.1);color-scheme:light}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;background:var(--bg) radial-gradient(900px 420px at 80% -8%,var(--glow),transparent 70%) no-repeat;color:var(--tx);font:400 15px/1.5 'Barlow',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;letter-spacing:.02em;-webkit-font-smoothing:antialiased;min-height:100vh}
header{padding:22px 24px 14px;display:flex;flex-wrap:wrap;gap:6px 24px;align-items:flex-end;justify-content:space-between;max-width:1180px;margin:0 auto}
.brand{font-weight:700;font-size:22px;letter-spacing:.32em;text-transform:uppercase}
.brand small{display:block;font-weight:500;font-size:10px;letter-spacing:.38em;color:var(--mut);margin-top:2px}
.hmeta{display:flex;flex-wrap:wrap;gap:4px 22px;font-size:11px;letter-spacing:.18em;text-transform:uppercase;color:var(--mut)}
.hmeta b{color:var(--tx);font-weight:600}
#hClock{font-size:22px;font-weight:300;letter-spacing:.12em;color:var(--tx);font-variant-numeric:tabular-nums}
#hClock small{font-size:10px;letter-spacing:.3em;color:var(--mut);font-weight:600}
header{align-items:center}.hmeta{margin-left:auto;align-items:center;gap:6px 16px}
.hsep{width:1px;height:22px;background:var(--line)}
#hDateL,#hLeft{font-size:12px;letter-spacing:.16em;text-transform:uppercase;color:var(--mut)}#hLeft b{font-size:20px;font-weight:300;color:var(--tx);letter-spacing:.06em}


/* stock-style charts */
.sc{display:block}
.sc-head{display:flex;flex-wrap:wrap;align-items:baseline;gap:4px 14px;margin-bottom:6px;min-height:38px}
.sc-val{font-size:34px;font-weight:300;line-height:1.05;font-variant-numeric:tabular-nums;letter-spacing:.01em}
.sc-badge{display:inline-flex;align-items:center;gap:4px;padding:3px 11px;border-radius:9px;font-size:14px;font-weight:600;letter-spacing:.02em;align-self:center}
.sc-badge.g{background:color-mix(in srgb,var(--ok) 26%,transparent);color:var(--ok)}
.sc-badge.b{background:color-mix(in srgb,var(--bad) 26%,transparent);color:var(--bad)}
.sc-sub{font-size:14px;color:var(--mut)}.sc-sub b{font-weight:600}
.sc-date{flex-basis:100%;font-size:12px;color:var(--mut);letter-spacing:.04em;margin-top:2px}
.sc-tabs{display:flex;border-bottom:1px solid var(--line);margin:8px 0 6px}
.sc-tabs button{flex:1;background:none;border:0;color:var(--mut);padding:9px 0;font:600 12px 'Barlow',sans-serif;letter-spacing:.14em;cursor:pointer;position:relative;transition:color .15s}
.sc-tabs button:hover{color:var(--tx)}
.sc-tabs button.on{color:var(--blue)}
.sc-tabs .sc-revbtn{flex:0 0 auto;padding:9px 12px;margin-left:6px;border-left:1px solid var(--line);font-size:11px;letter-spacing:.12em;text-transform:uppercase}
.sc-tabs .sc-revbtn.rev-on{color:var(--warn)}
.sc-tabs button.on::after{content:'';position:absolute;left:22%;right:22%;bottom:-1px;height:3px;border-radius:3px 3px 0 0;background:var(--blue)}
.sc-cv{position:relative;height:var(--sch,250px)}
canvas.sc-c{width:100%;height:100%;display:block;touch-action:pan-y;cursor:crosshair}
.sc-tip{position:absolute;top:6px;display:none;pointer-events:none;background:var(--optbg);border:1px solid var(--line2);border-radius:10px;padding:7px 11px;font-size:12px;line-height:1.5;white-space:nowrap;z-index:4;box-shadow:0 6px 22px rgba(0,0,0,.4);color:var(--tx)}
.sc-td{color:var(--mut);font-size:11.5px}
.sc-tr{display:flex;align-items:center;gap:6px}.sc-tr i{width:8px;height:8px;border-radius:50%;display:inline-block}
.sc-leg{display:flex;flex-wrap:wrap;gap:6px 18px;margin-top:8px;font-size:12px;color:var(--mut);min-height:16px}
.sc-chip i{display:inline-block;width:12px;height:3px;border-radius:2px;margin-right:6px;vertical-align:middle}.sc-chip b{color:var(--tx);font-weight:600;margin-left:3px}
:root[data-night="1"] canvas.sc-c{filter:none}

/* sleep mode: 12 AM - 6 AM Delhi time */
:root[data-night="1"]{--pri:#ff5a48;--ok:#ff8f7a;--warn:#ffb199;--bad:#ff2414;--bg:#140000;--card:rgba(255,30,20,.07);--tx:#ffd6d0;--mut:#d9786c;--line:rgba(255,60,40,.32);--line2:rgba(255,80,60,.6);--blue:#ff5a4a;--purple:#ff7a8a;
  --navbg:rgba(24,0,0,.82);--ov0:rgba(255,0,0,.02);--ov2:rgba(255,30,20,.1);--ov3:rgba(255,40,30,.16);--track:rgba(255,60,40,.22);--field:rgba(255,40,30,.08);--fieldf:rgba(255,40,30,.14);--hover:rgba(255,40,30,.07);--btnb:rgba(255,90,70,.85);--optbg:#1d0303;--chartbg:#1c0505;--nolog:#3a0c0a;--glow:rgba(255,0,0,.38);color-scheme:dark}
:root[data-night="1"] body{background:var(--bg) radial-gradient(1000px 520px at 78% -10%,rgba(255,0,0,.42),transparent 70%),radial-gradient(900px 500px at 0% 105%,rgba(160,0,0,.4),transparent 70%) no-repeat;background-attachment:fixed}
:root[data-night="1"] canvas{filter:sepia(1) saturate(5) hue-rotate(-52deg) brightness(.95)}
:root[data-night="1"] .brand,:root[data-night="1"] h2{text-shadow:0 0 18px rgba(255,0,0,.55)}
:root[data-night="1"] .card{box-shadow:0 0 0 1px rgba(255,0,0,.06) inset,0 0 22px rgba(160,0,0,.18)}
#nightBar{display:none}
:root[data-night="1"] #nightBar{display:block;background:linear-gradient(90deg,#6e0000,#b30000,#6e0000);color:#fff;text-align:center;padding:9px 14px;font:700 12px 'Barlow',sans-serif;letter-spacing:.28em;text-transform:uppercase;animation:nightpulse 2.4s ease-in-out infinite}
@keyframes nightpulse{0%,100%{box-shadow:0 0 0 rgba(255,0,0,0)}50%{box-shadow:0 2px 24px rgba(255,0,0,.75)}}
#profSel{background:transparent;border:1px solid var(--line);color:var(--tx);border-radius:2px;padding:6px 8px;font:600 11px 'Barlow',sans-serif;letter-spacing:.14em;text-transform:uppercase;cursor:pointer;width:auto}
#profSel option{background:var(--bg);color:var(--tx)}
#themeBtn{background:transparent;border:1px solid var(--line);color:var(--tx);width:36px;height:36px;border-radius:50%;cursor:pointer;display:grid;place-items:center;padding:0;transition:border-color .2s,background .2s}
#themeBtn:hover{border-color:var(--tx);background:var(--ov3)}
#themeBtn svg{width:17px;height:17px}#themeBtn .i-moon{display:none}
:root[data-theme=light] #themeBtn .i-sun{display:none}:root[data-theme=light] #themeBtn .i-moon{display:block}
@media(max-width:600px){.hsep{display:none}#hClock{font-size:18px}}
nav{display:flex;overflow-x:auto;position:sticky;top:0;z-index:10;background:var(--navbg);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-top:1px solid var(--line);border-bottom:1px solid var(--line);padding:0 12px;scrollbar-width:none}
nav::-webkit-scrollbar{display:none}
nav button{flex:0 0 auto;border:0;background:none;padding:15px 18px;font:600 12px 'Barlow',sans-serif;letter-spacing:.2em;text-transform:uppercase;color:var(--mut);cursor:pointer;border-bottom:2px solid transparent;transition:color .2s,border-color .2s}
nav button:hover{color:var(--tx)}
nav button.on{color:var(--tx);border-color:var(--tx)}
main{max-width:1180px;margin:0 auto;padding:28px 24px 80px}
h2{margin:6px 0 20px;font-size:28px;font-weight:600;letter-spacing:.14em;text-transform:uppercase}
h3{margin:0 0 10px;font-size:12px;font-weight:600;letter-spacing:.22em;text-transform:uppercase;color:var(--mut)}
main>h3{margin:28px 0 12px}
.grid{display:grid;gap:14px;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));margin-bottom:14px}
.grid2{display:grid;gap:14px;grid-template-columns:repeat(auto-fit,minmax(340px,1fr));margin-bottom:14px}
.card{background:var(--card);border:1px solid var(--line);border-radius:2px;padding:20px;margin-bottom:14px;min-width:0;transition:border-color .25s,background .25s}
.card:hover{border-color:var(--line2)}
.grid>.card,.grid2>.card{margin-bottom:0}
.big{font-size:38px;font-weight:300;line-height:1.05;letter-spacing:.01em;font-variant-numeric:tabular-nums}
.big span{letter-spacing:.06em}
.hero{padding:34px 28px;background:linear-gradient(135deg,var(--ov2),var(--ov0))}
.hero .big{font-size:clamp(56px,11vw,112px);font-weight:200;letter-spacing:-.01em}
.hero .big span{font-size:14px!important;font-weight:500!important;letter-spacing:.24em;text-transform:uppercase;color:var(--mut)}
.sub{color:var(--mut);font-size:12px;letter-spacing:.06em}
.card>.sub:first-child,.card .sub:first-child:not(:only-child){text-transform:uppercase;letter-spacing:.2em;font-size:11px;margin-bottom:6px}
.bar{height:3px;background:var(--track);overflow:hidden;margin:12px 0 6px}.bar>i{display:block;height:100%;background:var(--tx)}
.chip{display:inline-block;padding:2px 10px;border-radius:1px;font-size:10px;letter-spacing:.14em;text-transform:uppercase;font-weight:600;color:#000;background:var(--mut)}
.ok{color:var(--ok)}.warn{color:var(--warn)}.bad{color:var(--bad)}
.bg-ok{background:var(--ok)}.bg-warn{background:var(--warn)}.bg-bad{background:var(--bad)}.bg-mut{background:#4a4f57}
.alert{padding:12px 16px;border-radius:2px;margin-bottom:8px;font-size:14px;border:1px solid var(--line);border-left:3px solid}
.alert.r{background:rgba(255,90,82,.07);border-left-color:var(--bad)}.alert.g{background:rgba(61,220,151,.07);border-left-color:var(--ok)}
.lights{display:flex;gap:22px;flex-wrap:wrap}.light{display:flex;align-items:center;gap:10px;font-size:14px}
.light b{font-size:11px;letter-spacing:.2em;text-transform:uppercase}
.dot{width:10px;height:10px;border-radius:50%;display:inline-block;box-shadow:0 0 12px currentColor}
.dot.bg-ok{color:var(--ok)}.dot.bg-warn{color:var(--warn)}.dot.bg-bad{color:var(--bad)}.dot.bg-mut{box-shadow:none}
form .row{display:grid;gap:14px;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));margin-bottom:14px}
label{display:block;font-size:10.5px;font-weight:600;letter-spacing:.2em;text-transform:uppercase;color:var(--mut);margin-bottom:5px}
input,select,textarea{width:100%;padding:10px 12px;border:1px solid var(--line);border-radius:2px;font:inherit;background:var(--field);color:var(--tx);outline:none;transition:border-color .2s,background .2s}
input:focus,select:focus,textarea:focus{border-color:var(--tx);background:var(--fieldf)}
select option{background:var(--optbg);color:var(--tx)}
input[type=checkbox]{width:auto;margin-right:8px;accent-color:var(--tx)}
input:disabled,select:disabled,textarea:disabled{opacity:.5}
.chk{display:flex;align-items:center;padding-top:22px}.chk label{margin:0;color:var(--tx);font-size:13px;letter-spacing:.06em;text-transform:none;font-weight:500}
button.btn{background:transparent;color:var(--tx);border:1px solid var(--btnb);border-radius:2px;padding:11px 22px;font:600 12px 'Barlow',sans-serif;letter-spacing:.2em;text-transform:uppercase;cursor:pointer;transition:background .2s,color .2s,border-color .2s}
button.btn:hover{background:var(--tx);color:var(--bg)}
button.btn.s{padding:5px 11px;font-size:10px;letter-spacing:.14em}
button.btn.ok{background:var(--tx);color:var(--bg);border-color:var(--tx)}button.btn.ok:hover{background:transparent;color:var(--tx)}
button.btn.bad{color:var(--bad);border-color:rgba(255,90,82,.6)}button.btn.bad:hover{background:var(--bad);color:#000;border-color:var(--bad)}
button.btn.alt{border-color:var(--line);color:var(--mut)}button.btn.alt:hover{background:var(--ov3);color:var(--tx);border-color:var(--line2)}
button.btn:disabled{opacity:.35;cursor:not-allowed}
.tot{background:var(--field);border:1px solid var(--line);border-radius:2px;padding:12px 14px;font-size:14px;margin-bottom:14px}
table{width:100%;border-collapse:collapse;font-size:13px}th,td{padding:10px 10px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}
th{color:var(--mut);font-weight:600;font-size:10.5px;letter-spacing:.18em;text-transform:uppercase;white-space:nowrap}
tr:hover td{background:var(--hover)}
a{color:var(--blue)}
.tw{overflow-x:auto}
.cv{position:relative;height:260px}.cvh{position:relative}
.png{position:absolute;right:0;top:-34px;font:600 9px 'Barlow',sans-serif;letter-spacing:.18em;text-transform:uppercase;border:1px solid var(--line);background:transparent;border-radius:2px;cursor:pointer;color:var(--mut);padding:3px 8px}
.png:hover{color:var(--tx);border-color:var(--tx)}
.tl{display:flex;gap:10px;align-items:center;padding:5px 0;font-size:14px}
.hm{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}.hm div{aspect-ratio:1.6;border-radius:2px;font-size:11px;color:#000;font-weight:600;display:flex;align-items:center;justify-content:center}
.tools{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:16px}
ul{padding-left:18px}li{margin-bottom:4px}
::selection{background:var(--tx);color:var(--bg)}
::-webkit-scrollbar{height:8px;width:8px}::-webkit-scrollbar-thumb{background:var(--line2)}::-webkit-scrollbar-track{background:transparent}
@media(max-width:600px){main{padding:18px 14px 70px}header{padding:16px 14px 10px}.brand{font-size:17px}.big{font-size:30px}h2{font-size:21px}.card{padding:16px}}
@media print{*{-webkit-print-color-adjust:exact;print-color-adjust:exact}nav,.tools,.noprint,.png{display:none}body{background:var(--bg)}}
</style>
</head>
<body>

<script>
/* ---------- theme ---------- */
const THEME_KEY='abundx_theme';
let theme='dark';try{theme=localStorage.getItem(THEME_KEY)==='light'?'light':'dark'}catch(e){}
document.documentElement.dataset.theme=theme;
window.addEventListener('DOMContentLoaded',()=>{const s=document.getElementById('profSel');if(s)s.value=PROFILE});
const INK=()=>theme==='light'?'#1a1c20':'#e8eaed';
/* ---------- helpers ---------- */
const pad=n=>String(n).padStart(2,'0');
const ymd=d=>`${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const pd=s=>{const [y,m,d]=s.split('-').map(Number);return new Date(y,m-1,d)};
const addD=(s,n)=>{const d=pd(s);d.setDate(d.getDate()+n);return ymd(d)};
const diff=(a,b)=>Math.round((pd(b)-pd(a))/864e5);
const today=()=>ymd(new Date());
const mon=s=>{const d=pd(s);d.setDate(d.getDate()-((d.getDay()+6)%7));return ymd(d)};
const fmt=s=>pd(s).toLocaleDateString('en-IN',{day:'numeric',month:'short',year:'numeric'});
const fmtS=s=>pd(s).toLocaleDateString('en-IN',{day:'numeric',month:'short'});
const dow=s=>['Sun','Mon','Tue','Wed','Thu','Fri','Sat'][pd(s).getDay()];
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const sum=a=>a.reduce((x,y)=>x+y,0);
const avg=a=>a.length?sum(a)/a.length:null;
const r1=x=>x==null?'—':(Math.round(x*10)/10).toString();
const r0=x=>x==null?'—':Math.round(x).toString();
const $=s=>document.querySelector(s);
const v=id=>document.getElementById(id).value;
const n=id=>{const x=v(id);return x===''?null:Number(x)};

/* ---------- state ---------- */
const PROFILES={malik:{key:'jee2028_tracker_v1',name:'Malik'},kartik:{key:'jee2028_tracker_kartik_v1',name:'Kartik'}};
let PROFILE='malik';
try{const q=new URLSearchParams(location.search).get('p');if(q&&PROFILES[q])localStorage.setItem('abundx_profile',q);const sp=localStorage.getItem('abundx_profile');if(sp&&PROFILES[sp])PROFILE=sp}catch(e){}
function setProfile(p){try{localStorage.setItem('abundx_profile',p)}catch(e){}const u=new URL(location.href);if(u.searchParams.has('p')){u.searchParams.delete('p');u.hash='';location.replace(u.href)}else{location.hash='dashboard';location.reload()}}
const KEY=PROFILES[PROFILE].key;
const MAXM=PROFILE==='malik'?300:100;
const DEF=()=>({
  settings:{
    start:'2026-10-02',exam:'2028-01-20',weeklyMin:945,weeklyMax:1045,baseline:140,unlockPast:false,
    phases:[
      {name:'Phase 0',start:'2026-10-02',end:'2026-11-05',target:190,focus:'Math rescue (Coord Geom + Trig)',mix:[90,10,0]},
      {name:'Phase 1',start:'2026-11-06',end:'2027-01-31',target:210,focus:'Stage 1: Foundation mastery',mix:[70,25,5]},
      {name:'Phase 2',start:'2027-02-01',end:'2027-03-31',target:230,focus:'Stage 2: Optimization & speed',mix:[50,30,20]},
      {name:'Phase 3',start:'2027-04-01',end:'2027-10-02',target:265,focus:'Stage 3: Elite precision',mix:[30,10,60]}],
    resources:{
      Physics:[{name:'SL Arora',note:''},{name:'Cengage Physics (Mains)',note:''},{name:'Cengage Physics (Advanced)',note:''},{name:'Physics PYQ book',note:'Past-year questions'},{name:'Claude pager',note:'Daily pager questions'}],
      Chemistry:[{name:'NCERT',note:''},{name:'MS Chouhan',note:'Organic'},{name:'N Awasthi',note:'Physical'},{name:'IOC (VJ Sir)',note:'Inorganic'},{name:'Pradeep',note:''},{name:'Chemistry PYQ book',note:'Past-year questions'},{name:'Claude pager',note:'Daily pager questions'}],
      Math:[{name:'RD Sharma',note:''},{name:'Cengage Math (Mains)',note:''},{name:'Cengage Math (Advanced)',note:''},{name:'Math PYQ book',note:'Past-year questions'},{name:'Claude pager',note:'Daily pager questions'}]},
    milestones:[['2026-10-09',150],['2026-10-16',160],['2026-10-23',170],['2026-10-30',180],['2026-11-05',190],['2026-11-30',200],['2026-12-31',205],['2027-01-31',210],['2027-02-15',220],['2027-03-01',225],['2027-03-31',230],['2027-06-01',245],['2027-08-01',255],['2027-10-02',265]].map(([date,marks])=>({date,marks}))
  },

/* weekly report */
function weekData(key){
  const w=weekStats(key),prev=weekStats(addD(key,-7));
  const grp=k=>{const g=f=>sum(w.ls.filter(l=>f(pd(l.date).getDay())).map(l=>l[k]||0));return [g(d=>d>=1&&d<=5),g(d=>d===6),g(d=>d===0)]};
  const ms=mocks().filter(m=>m.date>=key&&m.date<=addD(key,6));
  const flags=[],recs=[];
  if(w.q&&w.q<900){flags.push(`Q count ${w.q} < 900`);recs.push('Protect all three study sessions; if coaching runs long, trim Session 2 filler rather than Session 3 backlog review.')}
  if(w.acc!=null&&prev.acc!=null&&prev.acc-w.acc>5){flags.push(`Accuracy down ${r1(prev.acc-w.acc)} pts`);recs.push('Slow down on new Q for 2 days and redo errors from the last 3 sessions before adding volume.')}
  if(w.sleep!=null&&w.sleep<6.5){flags.push(`Sleep avg ${r1(w.sleep)} h`);recs.push('Hard-stop at 11:30 PM; sleep is the one locked constraint.')}
  if(w.energy!=null&&w.energy<5){flags.push(`Energy avg ${r1(w.energy)}/10`);recs.push('Burnout risk: use the free time on Sat/Sun for real rest, not extra Q.')}
  const exT=S.settings.excusedThrough||'',missing=[0,1,2,3,4,5,6].filter(i=>{const x=addD(key,i);return !S.logs[x]&&x>exT}).length;if(w.days&&missing>0&&addD(key,6)<today())flags.push(`${missing} day(s) without a log`);
  const od=S.backlog.filter(b=>b.status!=='Resolved'&&diff(b.date,today())>SLA[b.priority]);
  if(od.length){flags.push(`${od.length} backlog item(s) past SLA`);recs.push('Clear overdue backlog items in Session 3 first: '+od.slice(0,3).map(b=>b.topic).join(', ')+'.')}
  if(!recs.length)recs.push(w.days?'On track - keep the same routine.':'No data for this week.');
  return {w,prev,grp,ms,flags,recs};
}

  const st=S.settings,t=today(),ms=mocks().filter(m=>m.marks!=null),last=ms.slice(-3),L=logs();
  const subj=[['Physics','phy'],['Chemistry','chem'],['Math','math']].map(([n,k])=>{const vals=last.map(m=>m[k]==null?null:m[k]-((m.grace&&m.grace[k])||0)).filter(x=>x!=null);return {n,k,vals,avg:avg(vals)}}).filter(s=>s.vals.length).sort((a,b)=>a.avg-b.avg);
  const latest=ms[ms.length-1],rank={High:0,Medium:1,Low:2};
  const open=S.backlog.filter(b=>b.status!=='Resolved').map(b=>({...b,age:diff(b.date,t),over:diff(b.date,t)>SLA[b.priority]}));

   <tr><td><b>TOTAL</b></td><td></td><td></td><td></td><td><b>${w.q}</b> / ${st.weeklyMin}–${st.weeklyMax}</td><td>100%</td></tr></table></div>
  <h3 style="margin-top:14px">Red flags</h3>${flags.length?flags.map(f=>`<div class="alert r">${esc(f)}</div>`).join(''):'<div class="sub">None 🎉</div>'}
  <h3 style="margin-top:10px">Recommended actions</h3><ul>${recs.map(r=>`<li>${esc(r)}</li>`).join('')}</ul>
  <div class="sub">Milestones this week: ${st.milestones.filter(m=>m.date>=repWeek&&m.date<=addD(repWeek,6)).map(m=>m.marks+'+ on '+fmtS(m.date)).join(', ')||'none'}</div></div>`;
}
function csv(kind){
  const rows=kind==='logs'?logs():kind==='mocks'?mocks():S.backlog;
  if(!rows.length)return alert('Nothing to export.');
  const keys=[...new Set(rows.flatMap(Object.keys))];
  const c=x=>{x=x==null?'':String(x);return /[",\n]/.test(x)?'"'+x.replace(/"/g,'""')+'"':x};
  dl(kind+'.csv',[keys.join(','),...rows.map(r=>keys.map(k=>c(r[k])).join(','))].join('\n'),'text/csv');
}
function dl(name,text,type){const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([text],{type}));a.download=name;a.click()}

/* ---------- SETTINGS ---------- */
function vSettings(){
  const s=S.settings;
  $('#app').innerHTML=`<h2>Settings</h2>
  <div class="card"><h3>Locked constraints</h3><div class="sub">Sleep 11:30 PM–6:30 AM (7 h) · Coaching 9 AM–3 PM Mon–Fri · Study 4:30–11:30 PM · 400-day target ~50,000–55,000 Q. These are fixed and not editable.</div></div>
  <form class="card" onsubmit="saveSettings(event)"><h3>Editable parameters</h3>
   <div class="row"><div><label>Plan start</label><input id="s0" type="date" value="${s.start}"></div><div><label>Exam date</label><input id="s1" type="date" value="${s.exam}"></div>
    <div><label>Weekly Q min</label><input id="s2" type="number" value="${s.weeklyMin}"></div><div><label>Weekly Q max</label><input id="s3" type="number" value="${s.weeklyMax}"></div><div><label>Baseline marks at start</label><input id="s4" type="number" value="${s.baseline}"></div></div>
   <h3>Phases</h3>${s.phases.map((p,i)=>`<div class="row"><div><label>Name</label><input id="pn${i}" value="${esc(p.name)}"></div><div><label>Start</label><input id="ps${i}" type="date" value="${p.start}"></div><div><label>End</label><input id="pe${i}" type="date" value="${p.end}"></div><div><label>Target marks</label><input id="pt${i}" type="number" value="${p.target}"></div><div><label>Focus</label><input id="pf${i}" value="${esc(p.focus)}"></div></div>`).join('')}
   <h3>Milestones</h3><div class="row" style="grid-template-columns:repeat(auto-fill,minmax(210px,1fr))">${s.milestones.map((m,i)=>`<div style="display:flex;gap:6px"><input id="md${i}" type="date" value="${m.date}"><input id="mm${i}" type="number" value="${m.marks}" style="width:80px"></div>`).join('')}</div>
   <div class="chk" style="padding:0 0 10px"><input type="checkbox" id="sul" ${s.unlockPast?'checked':''}><label for="sul">Allow editing locked weeks (normally locks Sunday 11:30 PM)</label></div>
   <button class="btn ok">Save settings</button></form>
  <div class="card"><h3>Data</h3><div class="tools"><button class="btn" onclick="dl('abundx-apex-backup-'+today()+'.json',JSON.stringify(S,null,1),'application/json')">Download backup (JSON)</button>
   <button class="btn alt" onclick="$('#imp').click()">Restore from backup</button><input id="imp" type="file" accept=".json" hidden onchange="restore(this)">
   <button class="btn bad" onclick="if(confirm('Delete ALL data in this browser?')&&confirm('Really? This cannot be undone.')){S=DEF();save();go('dashboard')}">Erase all data</button></div>
   <div class="sub">Data lives in this browser's localStorage only. Download a backup regularly — clearing site data deletes it.</div></div>${qBackup()?`
  <div class="card"><h3>Cleared question data</h3><div class="sub">All question counts were cleared on this device (23 Nov 2026). The old numbers are kept here: ${qBackup().days} day(s) and ${qBackup().weeks} weekly total(s).</div>
   <p><button class="btn alt" onclick="restoreQ()">Put the old question numbers back</button></p></div>`:''}`;
}
function qBackup(){try{const b=JSON.parse(localStorage.getItem(KEY+'_questions_backup')||'null');if(!b)return null;const C=['coaching','pager','textbook','pyq'];return{b,days:Object.values(b.logs||{}).filter(l=>C.some(c=>(l[c]||0)>0)).length,weeks:Object.keys(b.weekQ||{}).length}}catch(e){return null}}
function restoreQ(){
  const q=qBackup();if(!q)return;
  if(!confirm('Put back the old question numbers? Days you have logged since then are kept as they are.'))return;
  for(const [d,l] of Object.entries(q.b.logs||{})){if(!S.logs[d])S.logs[d]=l;else if(qTot(S.logs[d])===0)['coaching','pager','textbook','pyq'].forEach(c=>S.logs[d][c]=l[c]||0)}
  S.weekQ=Object.assign({},q.b.weekQ||{},S.weekQ||{});
  save();alert('Old question numbers restored.');go('dashboard');
}
function saveSettings(e){
  e.preventDefault();const s=S.settings;
  const P=s.phases.map((p,i)=>({...p,name:v('pn'+i),start:v('ps'+i),end:v('pe'+i),target:n('pt'+i),focus:v('pf'+i)}));
  for(const p of P)if(!p.start||!p.end||p.start>p.end)return alert(p.name+': invalid dates.');
  s.phases=P;s.start=v('s0');s.exam=v('s1');s.weeklyMin=n('s2');s.weeklyMax=n('s3');s.baseline=n('s4');s.unlockPast=$('#sul').checked;
  s.milestones=s.milestones.map((m,i)=>({date:v('md'+i),marks:n('mm'+i)})).sort((a,b)=>a.date<b.date?-1:1);
  save();alert('Saved.');render();
}
function restore(inp){
  const f=inp.files[0];if(!f)return;const r=new FileReader();
  r.onload=()=>{try{const o=JSON.parse(r.result);if(!o.logs||!o.settings)throw Error('not a tracker backup');if(!confirm('Replace current data with this backup?'))return;S={...DEF(),...o,settings:{...DEF().settings,...o.settings},clearQ1:true};save();go('dashboard')}catch(e){alert('Invalid backup: '+e.message)}};
  r.readAsText(f);
}

render();
</script>
