<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Abundx Apex</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Barlow:wght@200;300;400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.8.2/jspdf.plugin.autotable.min.js"></script>
<style>
:root{--pri:#f0f0fa;--ok:#3ddc97;--warn:#ffb020;--bad:#ff5a52;--bg:#000;--card:rgba(255,255,255,.035);--tx:#f0f0fa;--mut:#8a8f98;--line:rgba(255,255,255,.14);--line2:rgba(255,255,255,.3);--blue:#5aa9ff;--purple:#b388ff;
  --navbg:rgba(0,0,0,.72);--ov0:rgba(255,255,255,.01);--ov2:rgba(255,255,255,.06);--ov3:rgba(255,255,255,.1);--track:rgba(255,255,255,.12);--field:rgba(255,255,255,.04);--fieldf:rgba(255,255,255,.07);--hover:rgba(255,255,255,.025);--btnb:rgba(255,255,255,.7);--optbg:#111;--chartbg:#0b0b0c;--nolog:#2a2d31;--glow:rgba(90,169,255,.16);color-scheme:dark}
:root[data-theme=light]{--pri:#0d0f12;--ok:#0b9a62;--warn:#c27803;--bad:#d93a32;--bg:#f3f4f6;--card:#fff;--tx:#0d0f12;--mut:#5d636c;--line:rgba(0,0,0,.13);--line2:rgba(0,0,0,.32);--blue:#1d6fd6;--purple:#7c4dff;
  --navbg:rgba(243,244,246,.8);--ov0:rgba(0,0,0,.01);--ov2:rgba(0,0,0,.045);--ov3:rgba(0,0,0,.07);--track:rgba(0,0,0,.1);--field:rgba(0,0,0,.035);--fieldf:rgba(0,0,0,.06);--hover:rgba(0,0,0,.03);--btnb:rgba(0,0,0,.7);--optbg:#fff;--chartbg:#ffffff;--nolog:#d9dce1;--glow:rgba(29,111,214,.1);color-scheme:light}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;background:var(--bg) radial-gradient(900px 420px at 80% -8%,var(--glow),transparent 70%) no-repeat;color:var(--tx);font:400 15px/1.5 'Barlow',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;letter-spacing:.02em;-webkit-font-smoothing:antialiased;min-height:100vh}
header{padding:22px 24px 14px;display:flex;flex-wrap:wrap;gap:6px 24px;align-items:flex-end;justify-content:space-between;max-width:1180px;margin:0 auto}
.brand{font-weight:700;font-size:22px;letter-spacing:.32em;text-transform:uppercase}
.brand small{display:block;font-weight:500;font-size:10px;letter-spacing:.38em;color:var(--mut);margin-top:2px}
.hmeta{display:flex;flex-wrap:wrap;gap:4px 22px;font-size:11px;letter-spacing:.18em;text-transform:uppercase;color:var(--mut)}
.hmeta b{color:var(--tx);font-weight:600}
#hClock{font-size:22px;font-weight:300;letter-spacing:.12em;color:var(--tx);font-variant-numeric:tabular-nums}
#hClock small{font-size:10px;letter-spacing:.3em;color:var(--mut);font-weight:600}
header{align-items:center}.hmeta{margin-left:auto;align-items:center;gap:6px 16px}
.hsep{width:1px;height:22px;background:var(--line)}
#hDateL,#hLeft{font-size:12px;letter-spacing:.16em;text-transform:uppercase;color:var(--mut)}#hLeft b{font-size:20px;font-weight:300;color:var(--tx);letter-spacing:.06em}


/* stock-style charts */
.sc{display:block}
.sc-head{display:flex;flex-wrap:wrap;align-items:baseline;gap:4px 14px;margin-bottom:6px;min-height:38px}
.sc-val{font-size:34px;font-weight:300;line-height:1.05;font-variant-numeric:tabular-nums;letter-spacing:.01em}
.sc-badge{display:inline-flex;align-items:center;gap:4px;padding:3px 11px;border-radius:9px;font-size:14px;font-weight:600;letter-spacing:.02em;align-self:center}
.sc-badge.g{background:color-mix(in srgb,var(--ok) 26%,transparent);color:var(--ok)}
.sc-badge.b{background:color-mix(in srgb,var(--bad) 26%,transparent);color:var(--bad)}
.sc-sub{font-size:14px;color:var(--mut)}.sc-sub b{font-weight:600}
.sc-date{flex-basis:100%;font-size:12px;color:var(--mut);letter-spacing:.04em;margin-top:2px}
.sc-tabs{display:flex;border-bottom:1px solid var(--line);margin:8px 0 6px}
.sc-tabs button{flex:1;background:none;border:0;color:var(--mut);padding:9px 0;font:600 12px 'Barlow',sans-serif;letter-spacing:.14em;cursor:pointer;position:relative;transition:color .15s}
.sc-tabs button:hover{color:var(--tx)}
.sc-tabs button.on{color:var(--blue)}
.sc-tabs .sc-revbtn{flex:0 0 auto;padding:9px 12px;margin-left:6px;border-left:1px solid var(--line);font-size:11px;letter-spacing:.12em;text-transform:uppercase}
.sc-tabs .sc-revbtn.rev-on{color:var(--warn)}
.sc-tabs button.on::after{content:'';position:absolute;left:22%;right:22%;bottom:-1px;height:3px;border-radius:3px 3px 0 0;background:var(--blue)}
.sc-cv{position:relative;height:var(--sch,250px)}
canvas.sc-c{width:100%;height:100%;display:block;touch-action:pan-y;cursor:crosshair}
.sc-tip{position:absolute;top:6px;display:none;pointer-events:none;background:var(--optbg);border:1px solid var(--line2);border-radius:10px;padding:7px 11px;font-size:12px;line-height:1.5;white-space:nowrap;z-index:4;box-shadow:0 6px 22px rgba(0,0,0,.4);color:var(--tx)}
.sc-td{color:var(--mut);font-size:11.5px}
.sc-tr{display:flex;align-items:center;gap:6px}.sc-tr i{width:8px;height:8px;border-radius:50%;display:inline-block}
.sc-leg{display:flex;flex-wrap:wrap;gap:6px 18px;margin-top:8px;font-size:12px;color:var(--mut);min-height:16px}
.sc-chip i{display:inline-block;width:12px;height:3px;border-radius:2px;margin-right:6px;vertical-align:middle}.sc-chip b{color:var(--tx);font-weight:600;margin-left:3px}
:root[data-night="1"] canvas.sc-c{filter:none}

/* sleep mode: 12 AM - 6 AM Delhi time */
:root[data-night="1"]{--pri:#ff5a48;--ok:#ff8f7a;--warn:#ffb199;--bad:#ff2414;--bg:#140000;--card:rgba(255,30,20,.07);--tx:#ffd6d0;--mut:#d9786c;--line:rgba(255,60,40,.32);--line2:rgba(255,80,60,.6);--blue:#ff5a4a;--purple:#ff7a8a;
  --navbg:rgba(24,0,0,.82);--ov0:rgba(255,0,0,.02);--ov2:rgba(255,30,20,.1);--ov3:rgba(255,40,30,.16);--track:rgba(255,60,40,.22);--field:rgba(255,40,30,.08);--fieldf:rgba(255,40,30,.14);--hover:rgba(255,40,30,.07);--btnb:rgba(255,90,70,.85);--optbg:#1d0303;--chartbg:#1c0505;--nolog:#3a0c0a;--glow:rgba(255,0,0,.38);color-scheme:dark}
:root[data-night="1"] body{background:var(--bg) radial-gradient(1000px 520px at 78% -10%,rgba(255,0,0,.42),transparent 70%),radial-gradient(900px 500px at 0% 105%,rgba(160,0,0,.4),transparent 70%) no-repeat;background-attachment:fixed}
:root[data-night="1"] canvas{filter:sepia(1) saturate(5) hue-rotate(-52deg) brightness(.95)}
:root[data-night="1"] .brand,:root[data-night="1"] h2{text-shadow:0 0 18px rgba(255,0,0,.55)}
:root[data-night="1"] .card{box-shadow:0 0 0 1px rgba(255,0,0,.06) inset,0 0 22px rgba(160,0,0,.18)}
#nightBar{display:none}
:root[data-night="1"] #nightBar{display:block;background:linear-gradient(90deg,#6e0000,#b30000,#6e0000);color:#fff;text-align:center;padding:9px 14px;font:700 12px 'Barlow',sans-serif;letter-spacing:.28em;text-transform:uppercase;animation:nightpulse 2.4s ease-in-out infinite}
@keyframes nightpulse{0%,100%{box-shadow:0 0 0 rgba(255,0,0,0)}50%{box-shadow:0 2px 24px rgba(255,0,0,.75)}}
#hAv{width:34px;height:34px;border-radius:50%;border:1px solid var(--line);padding:0;overflow:hidden;cursor:pointer;background:transparent;color:var(--tx);font:600 13px 'Barlow',sans-serif;display:inline-flex;align-items:center;justify-content:center;flex:none}#hAv img{width:100%;height:100%;object-fit:cover;display:block}
#profSel{background:transparent;border:1px solid var(--line);color:var(--tx);border-radius:2px;padding:6px 8px;font:600 11px 'Barlow',sans-serif;letter-spacing:.14em;text-transform:uppercase;cursor:pointer;width:auto}
#profSel option{background:var(--bg);color:var(--tx)}
#themeBtn{background:transparent;border:1px solid var(--line);color:var(--tx);width:36px;height:36px;border-radius:50%;cursor:pointer;display:grid;place-items:center;padding:0;transition:border-color .2s,background .2s}
#themeBtn:hover{border-color:var(--tx);background:var(--ov3)}
#themeBtn svg{width:17px;height:17px}#themeBtn .i-moon{display:none}
:root[data-theme=light] #themeBtn .i-sun{display:none}:root[data-theme=light] #themeBtn .i-moon{display:block}
@media(max-width:600px){.hsep{display:none}#hClock{font-size:18px}}
nav{display:flex;overflow-x:auto;position:sticky;top:0;z-index:10;background:var(--navbg);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-top:1px solid var(--line);border-bottom:1px solid var(--line);padding:0 12px;scrollbar-width:none}
nav::-webkit-scrollbar{display:none}
nav button{flex:0 0 auto;border:0;background:none;padding:15px 18px;font:600 12px 'Barlow',sans-serif;letter-spacing:.2em;text-transform:uppercase;color:var(--mut);cursor:pointer;border-bottom:2px solid transparent;transition:color .2s,border-color .2s}
nav button:hover{color:var(--tx)}
nav button.on{color:var(--tx);border-color:var(--tx)}
main{max-width:1180px;margin:0 auto;padding:28px 24px 80px}
h2{margin:6px 0 20px;font-size:28px;font-weight:600;letter-spacing:.14em;text-transform:uppercase}
h3{margin:0 0 10px;font-size:12px;font-weight:600;letter-spacing:.22em;text-transform:uppercase;color:var(--mut)}
main>h3{margin:28px 0 12px}
.grid{display:grid;gap:14px;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));margin-bottom:14px}
.grid2{display:grid;gap:14px;grid-template-columns:repeat(auto-fit,minmax(340px,1fr));margin-bottom:14px}
.card{background:var(--card);border:1px solid var(--line);border-radius:2px;padding:20px;margin-bottom:14px;min-width:0;transition:border-color .25s,background .25s}
.card:hover{border-color:var(--line2)}
.grid>.card,.grid2>.card{margin-bottom:0}
.big{font-size:38px;font-weight:300;line-height:1.05;letter-spacing:.01em;font-variant-numeric:tabular-nums}
.big span{letter-spacing:.06em}
.hero{padding:34px 28px;background:linear-gradient(135deg,var(--ov2),var(--ov0))}
.hero .big{font-size:clamp(56px,11vw,112px);font-weight:200;letter-spacing:-.01em}
.hero .big span{font-size:14px!important;font-weight:500!important;letter-spacing:.24em;text-transform:uppercase;color:var(--mut)}
.sub{color:var(--mut);font-size:12px;letter-spacing:.06em}
.card>.sub:first-child,.card .sub:first-child:not(:only-child){text-transform:uppercase;letter-spacing:.2em;font-size:11px;margin-bottom:6px}
.bar{height:3px;background:var(--track);overflow:hidden;margin:12px 0 6px}.bar>i{display:block;height:100%;background:var(--tx)}
.dbth{display:inline-block;margin:4px 10px 4px 0;text-align:center;vertical-align:top}.dbth img{display:block;width:110px;height:110px;object-fit:cover;border:1px solid var(--line);border-radius:8px;cursor:zoom-in;background:#222}.dbopts{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:8px 0}.dbopts.one{grid-template-columns:1fr}@media(max-width:480px){.dbopts{grid-template-columns:1fr}}.dbopt{display:flex;gap:10px;align-items:center;text-align:left;padding:10px 12px;border:1px solid var(--line);border-radius:10px;background:transparent;color:var(--tx);font:inherit;cursor:pointer;text-transform:none;letter-spacing:normal}.dbopt .k{flex:none;width:28px;height:28px;border-radius:50%;border:1px solid var(--line);display:flex;align-items:center;justify-content:center;font-weight:700}.dbopt.sel{border-color:var(--blue);box-shadow:0 0 0 1px var(--blue)}.dbopt.ok{border-color:var(--ok);background:rgba(61,220,151,.14)}.dbopt.no{border-color:var(--bad);background:rgba(255,90,82,.14)}.dbcard{margin:22px 0;padding:24px 22px;border:1px solid var(--line);border-radius:14px;line-height:1.8}.dbcard>div{margin-top:14px;margin-bottom:6px}.dbcard>div:first-child{margin-top:0}.dbq>div{margin-top:18px!important;margin-bottom:18px!important}.dbq>div:first-of-type{margin-top:22px!important}.dbq .dbqt{font-size:17px;line-height:1.85}.dbcard .dbopts{gap:16px}.dbcard .dbopt{padding:18px 18px;gap:16px;min-height:66px;font-size:16px;line-height:1.6}.dbcard .dbopt .k{width:36px;height:36px}.dbcard .btn.s{padding-top:10px;padding-bottom:10px;margin:4px 4px 4px 0}.dbcard textarea{padding:12px 14px;line-height:1.6}.dbcard ol li{margin:6px 0}@media(max-width:480px){.dbcard{padding:18px 14px;margin:18px -6px}}.dbsol{margin:8px 0;padding:18px 20px;border:1px solid var(--warn);border-radius:10px;background:rgba(255,176,32,.08)}.dbpdf{display:inline-block;margin:4px 12px 4px 0;padding:8px 10px;border:1px solid var(--line);border-radius:8px}#dbLb{position:fixed;inset:0;background:rgba(0,0,0,.88);z-index:9999;display:flex;align-items:center;justify-content:center;cursor:zoom-out}#dbLb img{max-width:96vw;max-height:92vh;border-radius:6px;background:#fff}
.chip{display:inline-block;padding:2px 10px;border-radius:1px;font-size:10px;letter-spacing:.14em;text-transform:uppercase;font-weight:600;color:#000;background:var(--mut)}
.ok{color:var(--ok)}.warn{color:var(--warn)}.bad{color:var(--bad)}
.bg-ok{background:var(--ok)}.bg-warn{background:var(--warn)}.bg-bad{background:var(--bad)}.bg-mut{background:#4a4f57}
.alert{padding:12px 16px;border-radius:2px;margin-bottom:8px;font-size:14px;border:1px solid var(--line);border-left:3px solid}
.alert.r{background:rgba(255,90,82,.07);border-left-color:var(--bad)}.alert.g{background:rgba(61,220,151,.07);border-left-color:var(--ok)}
.lights{display:flex;gap:22px;flex-wrap:wrap}.light{display:flex;align-items:center;gap:10px;font-size:14px}
.light b{font-size:11px;letter-spacing:.2em;text-transform:uppercase}
.dot{width:10px;height:10px;border-radius:50%;display:inline-block;box-shadow:0 0 12px currentColor}
.dot.bg-ok{color:var(--ok)}.dot.bg-warn{color:var(--warn)}.dot.bg-bad{color:var(--bad)}.dot.bg-mut{box-shadow:none}
form .row{display:grid;gap:14px;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));margin-bottom:14px}
label{display:block;font-size:10.5px;font-weight:600;letter-spacing:.2em;text-transform:uppercase;color:var(--mut);margin-bottom:5px}
input,select,textarea{width:100%;padding:10px 12px;border:1px solid var(--line);border-radius:2px;font:inherit;background:var(--field);color:var(--tx);outline:none;transition:border-color .2s,background .2s}
input:focus,select:focus,textarea:focus{border-color:var(--tx);background:var(--fieldf)}
select option{background:var(--optbg);color:var(--tx)}
input[type=checkbox]{width:auto;margin-right:8px;accent-color:var(--tx)}
input:disabled,select:disabled,textarea:disabled{opacity:.5}
.chk{display:flex;align-items:center;padding-top:22px}.chk label{margin:0;color:var(--tx);font-size:13px;letter-spacing:.06em;text-transform:none;font-weight:500}
button.btn{background:transparent;color:var(--tx);border:1px solid var(--btnb);border-radius:2px;padding:11px 22px;font:600 12px 'Barlow',sans-serif;letter-spacing:.2em;text-transform:uppercase;cursor:pointer;transition:background .2s,color .2s,border-color .2s}
button.btn:hover{background:var(--tx);color:var(--bg)}
button.btn.s{padding:5px 11px;font-size:10px;letter-spacing:.14em}
button.btn.ok{background:var(--tx);color:var(--bg);border-color:var(--tx)}button.btn.ok:hover{background:transparent;color:var(--tx)}
button.btn.bad{color:var(--bad);border-color:rgba(255,90,82,.6)}button.btn.bad:hover{background:var(--bad);color:#000;border-color:var(--bad)}
button.btn.alt{border-color:var(--line);color:var(--mut)}button.btn.alt:hover{background:var(--ov3);color:var(--tx);border-color:var(--line2)}
button.btn:disabled{opacity:.35;cursor:not-allowed}
.tot{background:var(--field);border:1px solid var(--line);border-radius:2px;padding:12px 14px;font-size:14px;margin-bottom:14px}
table{width:100%;border-collapse:collapse;font-size:13px}th,td{padding:10px 10px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}
th{color:var(--mut);font-weight:600;font-size:10.5px;letter-spacing:.18em;text-transform:uppercase;white-space:nowrap}
tr:hover td{background:var(--hover)}
a{color:var(--blue)}
.tw{overflow-x:auto}
.cv{position:relative;height:260px}.cvh{position:relative}
.png{position:absolute;right:0;top:-34px;font:600 9px 'Barlow',sans-serif;letter-spacing:.18em;text-transform:uppercase;border:1px solid var(--line);background:transparent;border-radius:2px;cursor:pointer;color:var(--mut);padding:3px 8px}
.png:hover{color:var(--tx);border-color:var(--tx)}
.tl{display:flex;gap:10px;align-items:center;padding:5px 0;font-size:14px}
.hm{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}.hm div{aspect-ratio:1.6;border-radius:2px;font-size:11px;color:#000;font-weight:600;display:flex;align-items:center;justify-content:center}
.tools{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:16px}
ul{padding-left:18px}li{margin-bottom:4px}
::selection{background:var(--tx);color:var(--bg)}
::-webkit-scrollbar{height:8px;width:8px}::-webkit-scrollbar-thumb{background:var(--line2)}::-webkit-scrollbar-track{background:transparent}
@media(max-width:600px){main{padding:18px 14px 70px}header{padding:16px 14px 10px}.brand{font-size:17px}.big{font-size:30px}h2{font-size:21px}.card{padding:16px}}
@media print{*{-webkit-print-color-adjust:exact;print-color-adjust:exact}nav,.tools,.noprint,.png{display:none}body{background:var(--bg)}}
</style>
</head>
<body>
<div id="nightBar"></div>
<header><div class="brand">Abundx Apex<small>JEE 2028 Progress Tracker</small></div><div class="hmeta"><span id="hClock"></span><span class="hsep"></span><span id="hDateL"></span><span class="hsep"></span><span id="hLeft"></span><span class="hsep"></span><button id="hAv" type="button" onclick="photoPick()" title="Change your profile photo" aria-label="Change your profile photo"></button><input id="photoIn" type="file" accept="image/*" hidden onchange="photoSet(this.files[0]);this.value=''"><button id="themeBtn" onclick="toggleTheme()" title="Switch light / dark mode" aria-label="Switch light or dark mode"><svg class="i-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg><svg class="i-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg></button></div></header>
<nav id="nav"></nav>
<main id="app"></main>

<script>
/* ---------- theme ---------- */
const THEME_KEY='abundx_theme';
let theme='dark';try{theme=localStorage.getItem(THEME_KEY)==='light'?'light':'dark'}catch(e){}
document.documentElement.dataset.theme=theme;
const INK=()=>theme==='light'?'#1a1c20':'#e8eaed';
/* ---------- helpers ---------- */
const pad=n=>String(n).padStart(2,'0');
const ymd=d=>`${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const pd=s=>{const [y,m,d]=s.split('-').map(Number);return new Date(y,m-1,d)};
const addD=(s,n)=>{const d=pd(s);d.setDate(d.getDate()+n);return ymd(d)};
const diff=(a,b)=>Math.round((pd(b)-pd(a))/864e5);
const today=()=>ymd(new Date());
const mon=s=>{const d=pd(s);d.setDate(d.getDate()-((d.getDay()+6)%7));return ymd(d)};
const fmt=s=>pd(s).toLocaleDateString('en-IN',{day:'numeric',month:'short',year:'numeric'});
const fmtS=s=>pd(s).toLocaleDateString('en-IN',{day:'numeric',month:'short'});
const dow=s=>['Sun','Mon','Tue','Wed','Thu','Fri','Sat'][pd(s).getDay()];
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const sum=a=>a.reduce((x,y)=>x+y,0);
const avg=a=>a.length?sum(a)/a.length:null;
const r1=x=>x==null?'—':(Math.round(x*10)/10).toString();
const r0=x=>x==null?'—':Math.round(x).toString();
const $=s=>document.querySelector(s);
const v=id=>document.getElementById(id).value;
const n=id=>{const x=v(id);return x===''?null:Number(x)};

/* ---------- state ---------- */

const FDB=new Promise((res,rej)=>{const r=indexedDB.open('jee_files',1);r.onupgradeneeded=()=>r.result.createObjectStore('f');r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)});
const fop=async(mode,fn)=>{const db=await FDB;return new Promise((res,rej)=>{const t=db.transaction('f',mode);const rq=fn(t.objectStore('f'));t.oncomplete=()=>res(rq&&rq.result);t.onerror=()=>rej(t.error)})};
const fput=(k,b)=>fop('readwrite',o=>o.put(b,k)),fget=k=>fop('readonly',o=>o.get(k)),fdel=k=>fop('readwrite',o=>o.delete(k));

const resCat=b=>b.cat||(/PYQ/i.test(b.name)?'pyq':b.name==='Claude pager'?'claude':'core');
const bookList=cat=>['\u2014',...new Set(Object.values(S.settings.resources).flat().filter(b=>b.name&&resCat(b)===cat).map(b=>b.name)),'Other'];
const qTot=l=>(l.coaching||0)+(l.pager||0)+(l.textbook||0)+(l.pyq||0);
/* Quick logs made from the AI chat have no accuracy/energy/focus yet; averages skip them. */
const aqW=l=>l.accuracy==null?0:qTot(l);
const wAcc=ls=>{const w=sum(ls.map(aqW));return w?sum(ls.map(l=>(l.accuracy||0)*aqW(l)))/w:null};
const pc=x=>x==null?'—':x+'%';
const logs=()=>Object.values(S.logs).sort((a,b)=>a.date<b.date?-1:1);
function phaseFor(d){const P=S.settings.phases;let i=P.findIndex(p=>d>=p.start&&d<=p.end);if(i<0)i=d<P[0].start?0:P.length-1;return {...P[i],i}}
function weekStats(key){
  const ls=Object.values(S.logs).filter(l=>l.date>=key&&l.date<=addD(key,6));
  const lq=sum(ls.map(qTot)),q=Math.max(lq,(S.weekQ||{})[key]||0);
  const acc=wAcc(ls);
  return {key,ls,q,acc,days:ls.length,
    src:{coaching:sum(ls.map(l=>l.coaching||0)),pager:sum(ls.map(l=>l.pager||0)),textbook:sum(ls.map(l=>l.textbook||0)),pyq:sum(ls.map(l=>l.pyq||0))},
    sleep:avg(ls.filter(l=>l.sleep!=null).map(l=>l.sleep)),energy:avg(ls.map(l=>l.energy).filter(x=>x!=null)),focus:avg(ls.map(l=>l.focus).filter(x=>x!=null))};
}
function allWeeks(){
  const ls=logs(),wq=Object.keys(S.weekQ||{}).sort();if(!ls.length&&!wq.length)return [];
  const first=[ls.length?mon(ls[0].date):null,wq[0]].filter(Boolean).sort()[0];
  const out=[];for(let k=first;k<=mon(today());k=addD(k,7))out.push(weekStats(k));return out;
}
const totalQ=()=>sum(allWeeks().map(w=>w.q));
const overallAcc=()=>{const t=totalQ()-sum(logs().filter(l=>l.accuracy==null).map(qTot));return t>0?sum(logs().map(l=>(l.accuracy||0)*aqW(l)))/t:null};
const mocks=()=>[...S.mocks].sort((a,b)=>a.date<b.date?-1:1);
function expectedMarks(d){
  const pts=[{date:S.settings.start,marks:S.settings.baseline},...S.settings.milestones].sort((a,b)=>a.date<b.date?-1:1);
  if(d<=pts[0].date)return pts[0].marks;
  for(let i=1;i<pts.length;i++)if(d<=pts[i].date){const a=pts[i-1],b=pts[i];return a.marks+(b.marks-a.marks)*diff(a.date,d)/Math.max(1,diff(a.date,b.date))}
  return pts[pts.length-1].marks;
}
function streak(){let c=0,d=today();if(!S.logs[d]||qTot(S.logs[d])===0)d=addD(d,-1);while(S.logs[d]&&qTot(S.logs[d])>0){c++;d=addD(d,-1)}return c}
function isLocked(date){if(S.settings.unlockPast)return false;const sunEnd=pd(addD(mon(date),6));sunEnd.setHours(23,30,0,0);return new Date()>sunEnd}

function alerts(){
  const red=[],good=[],t=today(),st=S.settings;
  // missed log
  if(t>st.start){const y=addD(t,-1);if(y>=st.start&&y>(st.excusedThrough||'')&&!S.logs[y])red.push(`Missed study log for ${fmtS(y)} (${dow(y)}). Log it now if you studied.`)}
  const cur=mon(t),last=addD(cur,-7),prev=addD(cur,-14);
  const wl=weekStats(last),wp=weekStats(prev),wc=weekStats(cur);
  if(wl.days){
    if(wl.q<900)red.push(`Last week's Q count was ${wl.q}, below 900 (target ${st.weeklyMin}–${st.weeklyMax}).`);
    else if(wl.q>=st.weeklyMin)good.push(`Last week's target hit: ${wl.q} Q.`);
    if(wp.acc!=null&&wl.acc!=null&&wp.acc-wl.acc>5)red.push(`Accuracy dropped ${r1(wp.acc-wl.acc)} pts week-on-week (${r1(wp.acc)}% → ${r1(wl.acc)}%).`);
  }
  if(wc.days&&wc.q>=st.weeklyMin)good.push(`This week's Q target already hit (${wc.q} Q).`);
  const recent=logs().slice(-7);
  const sl=avg(recent.filter(l=>l.sleep!=null).map(l=>l.sleep));if(sl!=null&&sl<6.5)red.push(`Average sleep ${r1(sl)} h over last ${recent.length} logs (<6.5 h). Sleep is locked at 11:30 PM–6:30 AM.`);
  const en=avg(recent.map(l=>l.energy).filter(x=>x!=null));if(en!=null&&en<5)red.push(`Average energy ${r1(en)}/10 — burnout risk.`);
  const ms=mocks();
  const passed=st.milestones.filter(m=>m.date<=t).sort((a,b)=>a.date<b.date?-1:1).pop();
  if(passed&&ms.length){const lm=ms[ms.length-1];if(lm.marks<passed.marks)red.push(`Behind milestone: ${passed.marks}+ was due by ${fmtS(passed.date)}; latest mock is ${lm.marks}.`)}
  else if(passed&&!ms.length)red.push(`Milestone ${passed.marks}+ (${fmtS(passed.date)}) passed and no mock logged yet.`);
  const best=ms.length?Math.max(...ms.map(m=>m.marks)):0;
  const reached=st.milestones.filter(m=>m.date<=t&&best>=m.marks).pop();
  if(reached)good.push(`Marks milestone reached: ${reached.marks}+ (best mock ${best}).`);
  const s=streak();if(s>=7)good.push(`${s}-day logging streak!`);
  if(wl.acc>90||wc.acc>90)good.push(`Accuracy above 90% this/last week.`);
  // backlog overdue
  const od=S.backlog.filter(b=>b.status!=='Resolved'&&diff(b.date,t)>21).length;
  if(od)red.push(`${od} backlog item(s) older than 21 days.`);
  return {red,good};
}

function scNice(lo,hi,n){

  const raw=(hi-lo)/n,mag=Math.pow(10,Math.floor(Math.log10(raw))),f=raw/mag,step=(f<1.5?1:f<3?2:f<7?5:10)*mag;
  const a=Math.floor(lo/step+1e-9)*step,b=Math.ceil(hi/step-1e-9)*step,t=[];for(let v=a;v<=b+step/2;v+=step)t.push(+v.toFixed(10));return t;
}

  let G=null;
  function valAt(s,t){const p=s.pts;let lo=0,hi=p.length-1;if(!p.length)return null;
    for(const q of p)if(q.t===t)return q.y;

function calcLog(){

function saveLog(e){
  e.preventDefault();

  if(isLocked(d))return alert('That week is locked.');
  const q={coaching:n('lc')||0,pager:n('lp')||0,textbook:n('lt')||0,pyq:n('ly')||0};
  for(const k in q)if(q[k]<0||q[k]>200)return alert(`${k} Q must be 0–200.`);
  if(sum(Object.values(q))>200&&!confirm(`Total ${sum(Object.values(q))} Q exceeds 200/day cap. Save anyway?`))return;
  const acc=n('lacc'),en=n('len'),fo=n('lfo'),sl=n('lsl');
  if(acc==null||acc<0||acc>100)return alert('Accuracy must be 0–100.');
  if(en==null||en<1||en>10||fo==null||fo<1||fo>10)return alert('Energy and Focus must be 1–10.');
  if(sl!=null&&(sl<0||sl>12))return alert('Sleep must be 0–12 h.');
  if(sl!=null&&sl>8.5&&!confirm(`Sleep of ${sl} h is an outlier (>8.5). Save anyway?`))return;
  S.logs[d]={date:d,phase:phaseFor(d).name,...q,book:v('lbook'),pyqBook:v('lpbook'),years:v('lyears'),timed:$('#ltimed').checked,accuracy:acc,energy:en,focus:fo,sleep:sl,sleepQ:v('lsq'),onTime:$('#lon').checked,audio:$('#lau').checked,topics:v('ltop'),weak:v('lweak'),notes:v('lnote')};
  save();logDate=d;go('dashboard');
}
/* ---------- PDF (dark theme, matches the app) ---------- */
const PD={BG:[0,0,0],CARD:[13,13,15],ROW:[24,26,30],LINE:[62,64,70],TX:[240,240,250],MUT:[138,143,152],OK:[61,220,151],WARN:[255,176,32],BAD:[255,90,82],BLUE:[90,169,255],PURPLE:[179,136,255],
  OKBG:[10,42,31],WARNBG:[46,34,8],BADBG:[52,17,15]};
const PM=14;
function pdfOK(){if(window.jspdf&&window.jspdf.jsPDF)return true;alert('PDF library could not load (it needs internet once). Check your connection and refresh.');return false}
function pdfNew(){
  const doc=new window.jspdf.jsPDF({unit:'mm',format:'a4'});
  doc.W=doc.internal.pageSize.getWidth();doc.H=doc.internal.pageSize.getHeight();
  const fill=()=>{doc.setFillColor(...PD.BG);doc.rect(0,0,doc.W,doc.H,'F')};
  fill();const add=doc.addPage.bind(doc);doc.addPage=function(){const r=add.apply(null,arguments);fill();return r};
  return doc;
}
function pdfCap(doc,text,x,y,o){o=o||{};doc.setFont('helvetica',o.bold?'bold':'normal');doc.setFontSize(o.size||7);doc.setTextColor(...(o.color||PD.MUT));
  doc.text(String(text).toUpperCase(),x,y,{charSpace:o.cs??1.2,align:o.align})}
function pdfHead(doc,title,sub1,sub2){
  doc.setFont('helvetica','bold');doc.setFontSize(11);doc.setTextColor(...PD.TX);doc.text('ABUNDX APEX',PM,14,{charSpace:1.8});
  pdfCap(doc,'JEE 2028 Progress Tracker',PM,18,{size:6,cs:1.4});
  pdfCap(doc,'Generated '+fmt(today()),doc.W-PM,13,{size:6.5,cs:0,align:'right'});
  pdfCap(doc,Math.max(0,diff(today(),S.settings.exam))+' days to exam',doc.W-PM,17.5,{size:6.5,cs:0,align:'right'});
  doc.setDrawColor(...PD.LINE);doc.setLineWidth(.25);doc.line(PM,23,doc.W-PM,23);
  doc.setFont('helvetica','normal');doc.setFontSize(21);doc.setTextColor(...PD.TX);doc.text(title.toUpperCase(),PM,37,{charSpace:1.4});
  let y=44;[sub1,sub2].filter(Boolean).forEach(t=>{doc.setFont('helvetica','normal');doc.setFontSize(9);doc.setTextColor(...PD.MUT);doc.text(t,PM,y);y+=5});
  return y+3;
}
function pdfKpis(doc,y,items){
  const n=items.length,g=3,w=(doc.W-2*PM-(n-1)*g)/n;
  items.forEach((k,i)=>{const x=PM+i*(w+g);doc.setFillColor(...PD.CARD);doc.setDrawColor(...PD.LINE);doc.setLineWidth(.2);doc.rect(x,y,w,19,'FD');
    pdfCap(doc,k[0],x+3,y+6,{size:5.8,cs:.9});
    doc.setFont('helvetica','normal');doc.setFontSize(k[1].length>7?12:15);doc.setTextColor(...(k[2]||PD.TX));doc.text(String(k[1]),x+3,y+14.5);
    if(k[3]){doc.setFontSize(6);doc.setTextColor(...PD.MUT);doc.text(String(k[3]),x+3,y+17.6)}});
  return y+25;
}
function pdfSec(doc,text,y){pdfCap(doc,text,PM,y,{size:7.5,cs:1.6,color:PD.TX,bold:true});doc.setDrawColor(...PD.LINE);doc.setLineWidth(.2);doc.line(PM,y+2,doc.W-PM,y+2);return y+7}
function pdfEnsure(doc,y,need){if(y+need>doc.H-18){doc.addPage();return 16}return y}
function pdfBar(doc,x,y,w,frac,color,h){h=h||2;doc.setFillColor(40,42,46);doc.rect(x,y,w,h,'F');doc.setFillColor(...color);doc.rect(x,y,Math.max(0,Math.min(1,frac))*w,h,'F')}
function pdfTbl(doc,opts){
  doc.autoTable(Object.assign({margin:{left:PM,right:PM,bottom:16},theme:'grid',
    styles:{font:'helvetica',fontSize:8,cellPadding:2.2,textColor:PD.TX,lineColor:PD.LINE,lineWidth:.15,fillColor:PD.CARD,halign:'center',valign:'middle'},
    headStyles:{fillColor:PD.BG,textColor:PD.MUT,fontStyle:'bold',fontSize:6.5},
    footStyles:{fillColor:PD.ROW,textColor:PD.TX,fontStyle:'bold'},alternateRowStyles:{fillColor:[17,18,20]}},opts));
  return doc.lastAutoTable.finalY;
}
const up=a=>a.map(x=>typeof x==='string'?x.toUpperCase():x);
function pdfFoot(doc,label){
  const n=doc.getNumberOfPages();
  for(let i=1;i<=n;i++){doc.setPage(i);doc.setDrawColor(...PD.LINE);doc.setLineWidth(.2);doc.line(PM,doc.H-12,doc.W-PM,doc.H-12);
    pdfCap(doc,'Abundx Apex  -  '+label,PM,doc.H-7.5,{size:6,cs:.8});pdfCap(doc,`Page ${i} / ${n}`,doc.W-PM,doc.H-7.5,{size:6,cs:0,align:'right'})}
}
const tint=(g)=>g==='ok'?[PD.OK,PD.OKBG]:g==='warn'?[PD.WARN,PD.WARNBG]:[PD.BAD,PD.BADBG];
const SRC_RGB={pager:PD.BLUE,pyq:PD.OK,textbook:PD.WARN,coaching:PD.PURPLE};
function pdfSources(doc,y,src,q){
  const order=['pager','pyq','textbook','coaching'];
  let x=PM;const CW=doc.W-2*PM;
  order.forEach(k=>{const w=q?CW*src[k]/q:0;if(w>0){doc.setFillColor(...SRC_RGB[k]);doc.rect(x,y,w,3,'F');x+=w}});
  y+=9;
  order.forEach((k,i)=>{const lx=PM+i*(CW/4);doc.setFillColor(...SRC_RGB[k]);doc.rect(lx,y-2.4,2.4,2.4,'F');
    doc.setFont('helvetica','normal');doc.setFontSize(8);doc.setTextColor(...PD.TX);doc.text(`${SRC_LABEL[k]}  ${src[k]}  (${q?r0(src[k]/q*100):0}%)`,lx+4,y)});
  return y+6;
}

/* daily log */
function logPdf(from,to){
  if(!from||!to||from>to)return alert('Choose a valid date range.');
  if(!pdfOK())return;
  const L=logs().filter(l=>l.date>=from&&l.date<=to);
  if(!L.length)return alert('No logs in that date range.');
  const doc=pdfNew();
  const q=sum(L.map(qTot)),acc=wAcc(L);
  const av=k=>avg(L.filter(l=>l[k]!=null).map(l=>l[k]));
  const ph=phaseFor(L[L.length-1].date);
  let y=pdfHead(doc,'Daily Log Report',`${fmt(from)}  to  ${fmt(to)}`,`${ph.name}  |  target ${ph.target}+ marks`);
  y=pdfKpis(doc,y,[['Days logged',L.length],['Total Q',q],['Avg Q / day',r0(q/L.length)],['Accuracy',acc==null?'-':r1(acc)+'%',acc>=85?PD.OK:acc>=75?PD.WARN:PD.BAD],['Avg sleep',r1(av('sleep'))+' h'],['Avg energy',r1(av('energy'))+'/10']]);
  const src={};['pager','pyq','textbook','coaching'].forEach(k=>src[k]=sum(L.map(l=>l[k]||0)));
  y=pdfSec(doc,'Question sources',y);y=pdfSources(doc,y+1,src,q);
  const nc=src.pager+src.textbook+src.pyq;
  doc.setFontSize(7);doc.setTextColor(...PD.MUT);doc.text(`Target mix for ${ph.name} (Claude / Core books / PYQ book): ${ph.mix.join(' / ')}%     Your mix excluding class: ${nc?[src.pager,src.textbook,src.pyq].map(z=>r0(z/nc*100)).join(' / '):'-'}%`,PM,y);
  y=pdfSec(doc,'Daily breakdown',y+9);
  const last=to<today()?to:today(),body=[],meta=[];
  for(let wk=mon(from);wk<=last;wk=addD(wk,7)){
    const days=[];for(let i=0;i<7;i++){const d=addD(wk,i);if(d>=from&&d<=last)days.push(d)}
    const inR=days.map(d=>S.logs[d]).filter(Boolean),wq=sum(inR.map(qTot)),wa=wAcc(inR);
    body.push([{content:`WEEK OF ${fmtS(wk)} - ${fmtS(addD(wk,6))}     ${inR.length}/${days.length} DAYS LOGGED     ${wq} Q${days.length===7?`  (TARGET ${S.settings.weeklyMin}-${S.settings.weeklyMax})`:''}     ACCURACY ${wa==null?'-':r1(wa)+'%'}`,colSpan:11,styles:{fillColor:PD.ROW,textColor:PD.TX,fontStyle:'bold',halign:'left',fontSize:7}}]);meta.push(null);
    days.forEach(d=>{const l=S.logs[d];
      if(!l){body.push([{content:`${fmtS(d)} ${dow(d)}`,styles:{halign:'left'}},{content:'No log recorded',colSpan:10,styles:{textColor:PD.MUT,fontStyle:'italic',halign:'left'}}]);meta.push('none')}
      else{body.push([{content:`${fmtS(d)} ${dow(d)}`,styles:{halign:'left'}},l.coaching||0,l.pager||0,l.textbook||0,l.pyq||0,qTot(l),pc(l.accuracy),l.energy??'-',l.focus??'-',l.sleep??'-',(l.onTime?'11:30 ':'')+(l.audio?'Audio':'')||'-']);meta.push(l)}});
  }
  y=pdfTbl(doc,{startY:y,body,columnStyles:{0:{cellWidth:27},5:{fontStyle:'bold'},10:{cellWidth:22}},
    head:[up(['Date','Class','Claude','Core','PYQ','Total Q','Acc','Energy','Focus','Sleep h','Habits'])],
    foot:[['TOTAL',src.coaching,src.pager,src.textbook,src.pyq,q,acc==null?'-':r1(acc)+'%',r1(av('energy')),r1(av('focus')),r1(av('sleep')),'']],
    didParseCell(h){if(h.section!=='body')return;const l=meta[h.row.index];if(!l||l==='none')return;const c=h.column.index;
      const set=g=>{const [t,b]=tint(g);h.cell.styles.textColor=t;h.cell.styles.fillColor=b};
      if(c===6&&l.accuracy!=null)set(l.accuracy>=85?'ok':l.accuracy>=75?'warn':'bad');
      if(c===7&&l.energy!=null)set(l.energy>=7?'ok':l.energy>=5?'warn':'bad');
      if(c===9&&l.sleep!=null)set(l.sleep>=7?'ok':l.sleep>=6.5?'warn':'bad')}});
  y+=4;doc.setFontSize(6.5);doc.setTextColor(...PD.MUT);doc.text('Green = good (accuracy 85+, energy 7+, sleep 7+ h)   Amber = watch   Red = low (accuracy <75, energy <5, sleep <6.5 h)   11:30 = in bed by 11:30 PM',PM,y);
  const notes=L.filter(l=>l.topics||l.weak||l.notes||(l.book&&l.book!=='—')||(l.pyqBook&&l.pyqBook!=='—')||l.years);
  if(notes.length){
    y=pdfEnsure(doc,y+6,30);y=pdfSec(doc,'Topics, weak areas and notes',y+6);
    pdfTbl(doc,{startY:y,columnStyles:{0:{cellWidth:24},1:{cellWidth:38},2:{cellWidth:34},3:{cellWidth:36}},styles:{halign:'left',fontSize:8,cellPadding:2.2,textColor:PD.TX,lineColor:PD.LINE,lineWidth:.15,fillColor:PD.CARD,valign:'top'},
      head:[up(['Date','Topics studied','Weak topics','Sources','Notes'])],
      body:notes.map(l=>[`${fmtS(l.date)} ${dow(l.date)}`,l.topics||'-',l.weak||'-',[l.book&&l.book!=='—'?l.book:'',l.pyqBook&&l.pyqBook!=='—'?l.pyqBook:'',l.years?'PYQ '+l.years+(l.timed?' (timed)':''):''].filter(Boolean).join('\n')||'-',l.notes||'-'])});
  }
  pdfFoot(doc,'Daily Log Report');
  doc.save(from===to?`daily-log-${from}.pdf`:`daily-log-${from}_to_${to}.pdf`);
}

function weekData(key){
  const w=weekStats(key),prev=weekStats(addD(key,-7));
  const grp=k=>{const g=f=>sum(w.ls.filter(l=>f(pd(l.date).getDay())).map(l=>l[k]||0));return [g(d=>d>=1&&d<=5),g(d=>d===6),g(d=>d===0)]};
  const ms=mocks().filter(m=>m.date>=key&&m.date<=addD(key,6));
  const flags=[],recs=[];
  if(w.q&&w.q<900){flags.push(`Q count ${w.q} < 900`);recs.push('Protect all three study sessions; if coaching runs long, trim Session 2 filler rather than Session 3 backlog review.')}
  if(w.acc!=null&&prev.acc!=null&&prev.acc-w.acc>5){flags.push(`Accuracy down ${r1(prev.acc-w.acc)} pts`);recs.push('Slow down on new Q for 2 days and redo errors from the last 3 sessions before adding volume.')}
  if(w.sleep!=null&&w.sleep<6.5){flags.push(`Sleep avg ${r1(w.sleep)} h`);recs.push('Hard-stop at 11:30 PM; sleep is the one locked constraint.')}
  if(w.energy!=null&&w.energy<5){flags.push(`Energy avg ${r1(w.energy)}/10`);recs.push('Burnout risk: use the free time on Sat/Sun for real rest, not extra Q.')}
  const exT=S.settings.excusedThrough||'',missing=[0,1,2,3,4,5,6].filter(i=>{const x=addD(key,i);return !S.logs[x]&&x>exT}).length;if(w.days&&missing>0&&addD(key,6)<today())flags.push(`${missing} day(s) without a log`);

  return {w,prev,grp,ms,flags,recs};
}

const graceNote=(m,sub)=>{const k={Physics:'phy',Chemistry:'chem',Math:'math'}[sub],g=m.grace&&m.grace[k];return g?` <span class="sub">(${m[k]-g} + ${g} grace)</span>`:''};
function mockInsights(m,prev,ph,exp,best,worst){
  const sg=x=>(x>=0?'+':'')+r1(x),ins=[];
  if(worst&&best&&worst!==best)ins.push(`Strongest: <b>${best[0]}</b> (${best[1]}). Weakest: <b>${worst[0]}</b> (${worst[1]}), ${best[1]-worst[1]} marks behind your best subject.`);
  ins.push(`${m.marks>=exp?'Ahead of':'Behind'} the expected trajectory for ${fmtS(m.date)} (${r0(exp)}) by ${r0(Math.abs(m.marks-exp))} marks; ${ph.name} target is ${ph.target}+ (${m.marks>=ph.target?'reached':(ph.target-m.marks)+' marks to go'}).`);
  if(m.total&&m.correct!=null)ins.push(`${m.total-m.correct} of ${m.total} questions were not correct${m.correct*4===m.marks?' (marks = 4 x correct, so no negative marking applied)':''}. Each extra correct answer is worth +4.`);
  if(prev)ins.push(`Vs mock #${prev.num}: marks ${sg(m.marks-prev.marks)}${m.percentile!=null&&prev.percentile!=null?`, percentile ${sg(m.percentile-prev.percentile)}`:''}.`);
  if(m.hi!=null)ins.push(`${m.hi-m.marks} marks behind the class topper (${m.hi}).`);
  return ins;
}

function realityLines(d){
  const st=S.settings,L=[],dl=diff(d,st.exam);
  const planEnd=st.milestones[st.milestones.length-1],target=planEnd.marks;
  const ms=mocks().filter(m=>m.date<=d),last=ms[ms.length-1];
  if(dl>=0)L.push(`<b>${dl}</b> days to the exam (${r0(dl/7)} weeks). Every day from here is already counted.`);
  if(last){const gap=target-last.marks,mo=Math.max(1,dl/30),exp=expectedMarks(d);
    L.push(`Last mock: <b>${last.marks}</b> on ${fmtS(last.date)}. Target: <b>${target}</b>. Gap: <b>${gap>0?gap:0}</b> marks, which means gaining about <b>${gap>0?r1(gap/mo):0}</b> marks every month from now.`);
    L.push(`${last.marks>=exp?'You are ahead of':'You are behind'} your own plan line (<b>${r0(exp)}</b> expected today) by <b>${r0(Math.abs(last.marks-exp))}</b> marks.`)}
  else L.push(`No mock logged yet. Without a mock score you do not actually know where you stand.`);
  const logs14=logs().filter(l=>l.date<=d&&l.date>addD(d,-14));
  if(logs14.length>=3){const av=sum(logs14.map(qTot))/logs14.length,doneQ=sum(logs().filter(l=>l.date<=d).map(qTot)),daysToEnd=Math.max(1,diff(d,planEnd.date)),req=Math.max(0,(50000-doneQ)/daysToEnd);
    L.push(`Your last ${logs14.length} logged days average <b>${r0(av)}</b> Q/day. The 50,000 Q plan needs about <b>${r0(req)}</b> Q/day from here. ${av>=req?'You are on pace.':'You are short by '+r0(req-av)+' Q every day.'}`)}
  const wk=weekStats(mon(d)),missed=[];for(let i=0;i<7;i++){const x=addD(mon(d),i);if(x<=d&&x>=st.start&&x>(st.excusedThrough||'')&&!S.logs[x])missed.push(x)}
  if(missed.length)L.push(`<b>${missed.length}</b> day(s) this week with no log. If you did not log it, it did not happen.`);
  const open=S.backlog.filter(b=>b.date<=d&&(!b.resolved||b.resolved>d)),od=open.filter(b=>diff(b.date,d)>SLA[b.priority]);
  if(open.length)L.push(`<b>${open.length}</b> backlog topic(s) still open${od.length?`, <b>${od.length}</b> already past their deadline`:''}.`);
  return L.slice(0,5);

async function fileToAtt(f){
  if(f.type==='application/pdf'){
    if(f.size>15e6)throw new Error(f.name+' is over 15 MB, which is the most the AI can take. Use fewer pages (max 100).');
    return{name:f.name,media_type:'application/pdf',data:b64buf(await f.arrayBuffer())};
  }
  if(/^image\//.test(f.type)){
    let bmp;try{bmp=await createImageBitmap(f)}catch(e){throw new Error(f.name+' could not be read. Try a JPG or PNG.')}
    const k=Math.min(1,1600/Math.max(bmp.width,bmp.height)),c=document.createElement('canvas');
    c.width=Math.round(bmp.width*k);c.height=Math.round(bmp.height*k);
    const x=c.getContext('2d');x.fillStyle='#fff';x.fillRect(0,0,c.width,c.height);x.drawImage(bmp,0,0,c.width,c.height);
    return{name:f.name,media_type:'image/jpeg',data:c.toDataURL('image/jpeg',.85).split(',')[1]};
  }
  throw new Error(f.name+' is not a photo or PDF.');
}

function opsApply(ops){

    const p=pathParts(op.path),key=p[p.length-1];
    if(op.op==='set'){ensureParent(p)[key]=op.value}
    else if(op.op==='delete'){const par=getAt(S,p.slice(0,-1));if(par==null||typeof par!=='object')continue;Array.isArray(par)?par.splice(+key,1):delete par[key]}
    else if(op.op==='push'){const par=ensureParent(p);if(!Array.isArray(par[key]))par[key]=[];par[key].push(op.value)}
    else if(op.op==='update_where'){
      const c=getAt(S,p);if(c==null||typeof c!=='object')throw new Error('Nothing at '+op.path);let n=0;
      Object.values(c).forEach(it=>{if(rowMatch(it,op.where)){Object.assign(it,op.set||{});n++}});
      if(!n)throw new Error('No record matched in '+op.path);
    }else if(op.op==='remove_where'){
      const c=getAt(S,p);if(c==null||typeof c!=='object')throw new Error('Nothing at '+op.path);let n=0;
      if(Array.isArray(c)){for(let i=c.length-1;i>=0;i--)if(rowMatch(c[i],op.where)){c.splice(i,1);n++}}
      else Object.keys(c).forEach(k=>{if(rowMatch(c[k],op.where)){delete c[k];n++}});
      if(!n)throw new Error('No record matched in '+op.path);
    }else throw new Error('Unknown operation '+op.op);
  }
}

function opLines(ops){
  const sh=v=>{let s=JSON.stringify(v);if(s===undefined)return 'nothing';return s.length>70?s.slice(0,70)+'…':s};
  const out=[];
  for(const op of ops.slice(0,14)){
    let line;try{
      const p=pathParts(op.path);
      if(op.op==='set')line=`Set <b>${esc(op.path)}</b> to ${esc(sh(op.value))} <span class="sub">(now ${esc(sh(getAt(S,p)))})</span>`;
      else if(op.op==='delete')line=`Delete <b>${esc(op.path)}</b> <span class="sub">(now ${esc(sh(getAt(S,p)))})</span>`;
      else if(op.op==='push')line=`Add to <b>${esc(op.path)}</b>: ${esc(sh(op.value))}`;
      else{const c=getAt(S,p),n=c&&typeof c==='object'?Object.values(c).filter(it=>rowMatch(it,op.where)).length:0;
        line=op.op==='update_where'?`Change ${n} record(s) in <b>${esc(op.path)}</b> where ${esc(sh(op.where))}: ${esc(sh(op.set))}`:`Remove ${n} record(s) from <b>${esc(op.path)}</b> where ${esc(sh(op.where))}`}
    }catch(e){line='Invalid step: '+esc(String(op.path))}
    out.push(`<li>${line}</li>`);
  }
  if(ops.length>14)out.push(`<li class="sub">and ${ops.length-14} more steps</li>`);
  return '<ul style="margin:6px 0 0 18px;padding:0">'+out.join('')+'</ul>';
}

const mdInline=s=>esc(s).replace(/\*\*(.+?)\*\*/g,'<b>$1</b>').replace(/(^|[^*])\*([^*\n]+)\*/g,'$1<i>$2</i>').replace(/`([^`]+)`/g,'<code>$1</code>');
function mdHtml(md){
  const L=String(md).replace(/\r/g,'').split('\n'),o=[];let i=0,list=null;const close=()=>{if(list){o.push('</'+list+'>');list=null}};
  while(i<L.length){
    const t=L[i].trim();let m;
    if(!t){close();i++;continue}
    if(m=t.match(/^(#{1,4})\s+(.*)$/)){close();o.push(`<h${m[1].length}>${mdInline(m[2])}</h${m[1].length}>`);i++;continue}
    if(/^(-{3,}|\*{3,})$/.test(t)){close();o.push('<hr>');i++;continue}
    if(t.startsWith('```')){close();i++;const c=[];while(i<L.length&&!L[i].trim().startsWith('```')){c.push(L[i]);i++}i++;o.push('<pre><code>'+esc(c.join('\n'))+'</code></pre>');continue}
    if(t.startsWith('>')){close();const c=[];while(i<L.length&&L[i].trim().startsWith('>')){c.push(L[i].trim().replace(/^>\s?/,''));i++}o.push('<blockquote>'+c.map(mdInline).join('<br>')+'</blockquote>');continue}
    if(t.startsWith('|')){close();const rows=[];while(i<L.length&&L[i].trim().startsWith('|')){rows.push(L[i].trim());i++}
      const cells=r=>r.replace(/^\||\|$/g,'').split('|').map(c=>c.trim()),sep=rows.length>1&&/^[\s|:-]+$/.test(rows[1]);
      const head=sep?cells(rows[0]):null,body=rows.slice(sep?2:0).map(cells);
      o.push('<table>'+(head?'<tr>'+head.map(c=>`<th>${mdInline(c)}</th>`).join('')+'</tr>':'')+body.map(r=>'<tr>'+r.map(c=>`<td>${mdInline(c)}</td>`).join('')+'</tr>').join('')+'</table>');continue}
    if(m=t.match(/^[-*•]\s+(.*)$/)){if(list!=='ul'){close();o.push('<ul>');list='ul'}o.push(`<li>${mdInline(m[1])}</li>`);i++;continue}
    if(m=t.match(/^\d+[.)]\s+(.*)$/)){if(list!=='ol'){close();o.push('<ol>');list='ol'}o.push(`<li>${mdInline(m[1])}</li>`);i++;continue}
    close();o.push(`<p>${mdInline(t)}</p>`);i++;
  }
  close();return o.join('');
}

    else{

        Object.values(K).sort((x,y)=>(l[y]||0)-(l[x]||0)).forEach(c=>{const t=Math.min(n,l[c]||0);l[c]=(l[c]||0)-t;n-=t;removed+=t})}
    }

    return coachRender();
  }
  const k=K[a.source]||'textbook';
  const l=S.logs[a.date]||{date:a.date,phase:phaseFor(a.date).name,coaching:0,pager:0,textbook:0,pyq:0,accuracy:null,energy:null,focus:null,sleep:null,quick:true,topics:'',weak:'',notes:'Logged from the AI chat. Open Daily Log to add accuracy, energy and sleep.'};

  coachRender();
}

/* ---------- COMMITMENT TRACKER: promises you make to yourself (S.commitments) ---------- */
const CM_CAT=['Daily','Weekly','Monthly','Academic','Habit','Long-term'],CM_PR=['Low','Medium','High','Critical'],CM_PW={Low:1,Medium:2,High:3,Critical:5};
const CM_EST={Daily:2,Weekly:6,Monthly:20,Academic:8,Habit:1,'Long-term':40};
const CM_MISS=['Insufficient time','Unexpected interruption','Fatigue','Wrong workload estimate','Lost motivation','Other'];
let cmF={q:'',st:'all',cat:'',sub:'',pr:'',mo:''},cmEdit=null,cmAct=null,cmDraft=null,cmShow={};
const cmList=()=>Array.isArray(S.commitments)?S.commitments:(S.commitments=[]);
const cmEst=c=>c.estHours>0?+c.estHours:(CM_EST[c.category]||2);
const cmRem=c=>cmEst(c)*(1-Math.min(100,c.progress||0)/100);
const cmW=c=>(CM_PW[c.priority]||2)*(0.5+Math.min(Math.max(cmEst(c),0.5),8)/4);
const cmNewId=()=>'CM'+String(cmList().reduce((m,c)=>Math.max(m,+String(c.id).slice(2)||0),0)+1).padStart(3,'0');
const cmGrace=c=>c.status==='Cancelled'&&(c.progress||0)===0&&c.closedOn&&c.created&&diff(c.created,c.closedOn)<=1;
const cmClosed=()=>cmList().filter(c=>['Completed','Missed','Cancelled'].includes(c.status)&&!cmGrace(c));
function commitSync(){
  const L=S.commitments;if(!Array.isArray(L)||!L.length)return;const t=today(),now=new Date().toISOString();
  L.forEach(c=>{
    if(!c.created)c.created=t;if(!c.category)c.category='Daily';if(!c.priority)c.priority='Medium';if(typeof c.progress!=='number')c.progress=+c.progress||0;
    if(!c.source)c.source='chat';if(!c.status)c.status='Active';if(!Array.isArray(c.versions))c.versions=[];if(!Array.isArray(c.updates))c.updates=[];if(!Array.isArray(c.dependsOn))c.dependsOn=c.dependsOn?[c.dependsOn]:[];
    if(c.lastDeadline==null)c.lastDeadline=c.deadline;else if(c.lastDeadline!==c.deadline){
      c.versions.push({ts:now,field:'deadline',from:c.lastDeadline,to:c.deadline});
      if(c.deadline>c.lastDeadline)c.postponeCount=(c.postponeCount||0)+1;
      if(c.status==='Missed'&&c.deadline>=t){c.status='Active';c.completedOn=null;c.closedOn=null}
      c.lastDeadline=c.deadline}
    if(c.lastTitle==null)c.lastTitle=c.title;else if(c.lastTitle!==c.title){c.versions.push({ts:now,field:'title',from:c.lastTitle,to:c.title});c.lastTitle=c.title}
    if(c.status==='Missed'&&c.progress>=100){c.status='Completed';c.completedOn=c.completedOn||t}
    if(c.status==='Active'){if(c.progress>=100){c.status='Completed';c.completedOn=c.completedOn||t}else if(c.deadline&&c.deadline<t){c.status='Missed';c.closedOn=c.deadline}}
  });
  L.forEach(p=>{const ch=L.filter(c=>c.parentId===p.id&&c.status!=='Cancelled');if(ch.length&&p.status==='Active')p.progress=Math.round(avg(ch.map(c=>c.progress||0)))});
}
function cmFeas(d,selfId){
  const t=today(),L=cmList().filter(c=>c.status==='Active'&&c.id!==selfId),msgs=[];let level='ok';
  const bump=l=>{if(l==='bad'||(l==='warn'&&level==='ok'))level=l};
  if(!d.deadline||d.deadline<t)return {level:'bad',msgs:['That deadline is in the past.'],avail:0,need:0,free:0,fix:null};
  const need=d.estHours>0?+d.estHours:(CM_EST[d.category]||2);
  const availTo=dd=>{let a=0;for(let x=t;x<=dd;x=addD(x,1))a+=planMin(x)/60;return a},avail=availTo(d.deadline);
  const other=sum(L.filter(c=>c.deadline<=d.deadline).map(cmRem)),free=avail-other;
  if(need>free){bump(free<=0||need>free*1.5?'bad':'warn');msgs.push(`This needs about ${r1(need)} h, but only about ${r1(Math.max(0,free))} h of your planned study time is free by ${fmtS(d.deadline)} (${r1(avail)} h planned, ${r1(other)} h already promised to other commitments).`)}
  const cl=cmClosed().filter(c=>c.category===d.category);
  if(cl.length>=3){const ok=cl.filter(c=>c.status==='Completed').length/cl.length;if(ok<0.5){bump('warn');msgs.push(`You completed only ${r0(ok*100)}% of your last ${cl.length} ${d.category} commitments.`)}}
  if(L.length>=8){bump('warn');msgs.push(`You already have ${L.length} active commitments.`)}
  let fix=null;if(level!=='ok'){for(let k=1;k<=120;k++){const dd=addD(d.deadline,k);if(need<=availTo(dd)-sum(L.filter(c=>c.deadline<=dd).map(cmRem))){fix=dd;break}}}
  return {level,msgs,avail,need,free,fix};
}
function cmConflicts(){
  const t=today(),A=cmList().filter(c=>c.status==='Active'&&c.deadline>=t).sort((a,b)=>a.deadline<b.deadline?-1:1),out=[];
  [...new Set(A.map(c=>c.deadline))].forEach(d=>{

const DB_AR='Assertion & Reason',DB_ABC=['A','B','C','D','E','F'],DB_AROPT=['Both Statement 1 and Statement 2 are true','Both Statement 1 and Statement 2 are false','Statement 1 is true but Statement 2 is false','Statement 1 is false but Statement 2 is true'];
const DB_CAT=['Concept','Problem / numerical','Formula or derivation','Silly mistake','Test question','Other'],DB_ST=['Open','Asked','Resolved'],DB_PR=['High','Medium','Low'],DB_MAXPDF=8*1024*1024;
let dbF={sub:'',cat:'',fmt:'',st:'open',q:''},dbEdit=null,dbTarget=null;
const dbRaw=()=>Array.isArray(S.doubts)?S.doubts:(S.doubts=[]);
const dbList=()=>{const L=dbRaw();L.forEach(dbMig);return L};
const dbNewId=()=>'DB'+String(dbList().reduce((m,x)=>Math.max(m,+String(x.id).slice(2)||0),0)+1).padStart(3,'0');
const dbSubj=()=>PROFILE==='malik'?['Physics','Chemistry','Math','Other']:['Physics','Other'];
const dbFid=()=>'f'+Date.now().toString(36)+Math.random().toString(36).slice(2,8);
const dbKb=b=>b>=1048576?(b/1048576).toFixed(1)+' MB':Math.max(1,Math.round(b/1024))+' KB';
function dbImg(file){return new Promise((res,rej)=>{const u=URL.createObjectURL(file),im=new Image();im.onload=()=>{const k=Math.min(1,1600/Math.max(im.width,im.height)),c=document.createElement('canvas');c.width=Math.max(1,Math.round(im.width*k));c.height=Math.max(1,Math.round(im.height*k));const x=c.getContext('2d');x.fillStyle='#fff';x.fillRect(0,0,c.width,c.height);x.drawImage(im,0,0,c.width,c.height);c.toBlob(b=>{URL.revokeObjectURL(u);b?res(b):rej(new Error('Could not process '+file.name))},'image/jpeg',0.82)};im.onerror=()=>{URL.revokeObjectURL(u);rej(new Error('Could not read '+file.name+'. Use a JPG, PNG or WebP photo, or a PDF.'))};im.src=u})}
const dbB64=b=>new Promise((res,rej)=>{const r=new FileReader();r.onload=()=>res(String(r.result).split(',')[1]||'');r.onerror=()=>rej(r.error);r.readAsDataURL(b)});
async function dbCloud(op,body){const c=syncCfg();if(!c||!COACH_API)return null;try{const r=await fetch(COACH_API+'/sync',{method:'POST',body:JSON.stringify({op,code:c.code,profile:PROFILE,...body})});return r.ok?await r.json():null}catch(e){return null}}
async function dbUpload(f,blob){try{blob=blob||await fget('db:'+f.id);if(!blob||!syncCfg())return;const j=await dbCloud('fput',{id:f.id,type:f.type,b64:await dbB64(blob)});if(j&&j.ok&&!f.cloud){f.cloud=true;save()}}catch(e){}}
async function dbBlob(f){
  let b=null;try{b=await fget('db:'+f.id)}catch(e){}
  if(b)return b;
  if(!f.cloud)return null;
  const j=await dbCloud('fget',{id:f.id});if(!j||!j.b64)return null;
  try{b=await (await fetch('data:'+(j.type||f.type)+';base64,'+j.b64)).blob();await fput('db:'+f.id,b)}catch(e){}
  return b;
}
async function dbAttach(files,d){
  const bad=[];
  for(const file of [...files]){
    try{
      const pdf=file.type==='application/pdf'||/\.pdf$/i.test(file.name),img=file.type.startsWith('image/');
      if(!pdf&&!img){bad.push(file.name+': only photos and PDFs');continue}
      if(pdf&&file.size>DB_MAXPDF){bad.push(file.name+': PDF is over 8 MB');continue}
      const blob=pdf?new Blob([file],{type:'application/pdf'}):await dbImg(file),f={id:dbFid(),name:pdf?file.name:file.name.replace(/\.[^.]+$/,'')+'.jpg',type:blob.type,size:blob.size};
      await fput('db:'+f.id,blob);(d.files=d.files||[]).push(f);dbUpload(f,blob);
    }catch(e){bad.push((e&&e.message)||file.name)}
  }
  if(bad.length)alert('Some files were not added:\n'+bad.join('\n'));
}

/* ----- MCQ format (universal structure: id, question, options, type, correct, subject/chapter/topic, difficulty, solution, source, marking, verification) ----- */
const DB_Q=[['','None (just a doubt)'],['single_correct','Single correct'],['multiple_correct','Multiple correct'],['numerical','Numerical value'],['assertion_reason','Assertion–Reason'],['match_following','Match the following'],['matrix_match','Matrix match'],['paragraph','Paragraph-based MCQ'],['image','Image-based MCQ']];
const DB_DIFF=['Easy','Moderately easy','Medium','Hard','Very hard'];
let dbShow={};
const dbQName=q=>(DB_Q.find(x=>x[0]===q)||['',''])[1];
const dbMulti=q=>q==='multiple_correct'||q==='matrix_match';
const dbArr=x=>(Array.isArray(x)?x:x?String(x).split(/[,\s]+/):[]).map(y=>String(y).trim().toUpperCase()).filter(y=>DB_ABC.includes(y));
const dbLines=x=>(Array.isArray(x)?x:String(x||'').split('\n')).map(y=>String(y).trim()).filter(Boolean);
const dbQid=()=>'MCQ-'+String(dbRaw().reduce((m,x)=>Math.max(m,+String(x.qid||'').slice(4)||0),0)+1).padStart(6,'0');
function dbMig(d){
  if(d.category===DB_AR){d.category='Concept';if(!d.qtype)d.qtype='assertion_reason'}
  if(!d.qtype)return;
  if(d.opts)d.opts=d.opts.map(o=>o&&typeof o==='object'?String(o.text||''):String(o??''));
  if(!Array.isArray(d.correct))d.correct=dbArr(d.correct);
  if(!Array.isArray(d.mine))d.mine=dbArr(d.mine);
  if(!d.qid)d.qid=dbQid();
}
function dbResult(d){
  const marks=d.marks??4,neg=d.neg??1;
  if(d.qtype==='numerical'){const a=String(d.numAns??'').trim(),m=String(d.numMine??'').trim();if(!a)return null;if(!m)return {s:'skipped',score:0};const ok=a===m||(isFinite(+a)&&isFinite(+m)&&Math.abs(+a-+m)<1e-6);return {s:ok?'right':'wrong',score:ok?marks:-neg}}
  const c=dbArr(d.correct),m=dbArr(d.mine);if(!c.length)return null;if(!m.length)return {s:'skipped',score:0};
  const ok=c.length===m.length&&c.every(x=>m.includes(x));return {s:ok?'right':'wrong',score:ok?marks:-neg};
}
function dbQHtml(d){
  if(!d.qtype)return '';
  const show=!!dbShow[d.id],num=d.qtype==='numerical',c=dbArr(d.correct),m=dbArr(d.mine),r=dbResult(d),pre='white-space:pre-wrap';
  const list=(h,t)=>dbLines(t).length?`<div style="flex:1;min-width:200px"><b>${h}</b>${dbLines(t).map(x=>`<div>${esc(x)}</div>`).join('')}</div>`:'';
  const long=(d.opts||[]).some(o=>o.length>34);
  const opts=num?`<div style="margin:8px 0"><label>Your answer</label><input style="max-width:220px" value="${esc(d.numMine??'')}" ${show?'disabled':''} onchange="dbNum('${d.id}',this.value)" placeholder="Type a number"></div>`
    :`<div class="dbopts${long?' one':''}">${(d.opts||[]).map((o,i)=>{if(!o)return '';const k=DB_ABC[i],sel=m.includes(k),cls=show?(c.includes(k)?'ok':sel?'no':''):(sel?'sel':'');return `<button type="button" class="dbopt ${cls}" onclick="dbPick('${d.id}','${k}')" aria-pressed="${sel}"><span class="k">${k}</span><span>${esc(o)}</span></button>`}).join('')}</div>`;
  const sol=show?`<div class="dbsol"><div><b>Correct answer: ${num?esc(d.numAns||'not set'):c.join(', ')||'not set'}</b>${r&&r.s!=='skipped'?` <span class="chip ${r.s==='right'?'bg-ok':'bg-bad'}">${r.s==='right'?'You got it':'Not correct'} (${r.score>0?'+':''}${r.score})</span>`:''}</div>
      ${d.expl?`<div style="margin-top:6px"><b>Explanation</b><div style="${pre}">${esc(d.expl)}</div></div>`:''}${dbLines(d.steps).length?`<div style="margin-top:6px"><b>Steps</b><ol style="margin:4px 0 0 20px">${dbLines(d.steps).map(x=>`<li>${esc(x)}</li>`).join('')}</ol></div>`:''}${!d.expl&&!dbLines(d.steps).length?'<div class="sub">No solution written yet. Use Edit to add one.</div>':''}</div>`:'';
  return `<div class="dbq"><span class="chip">${esc(d.qid||'')}</span> <span class="chip">${esc(dbQName(d.qtype))}</span>
    ${d.passage?`<div style="margin:8px 0;padding:8px 10px;border-left:3px solid var(--line);${pre}">${esc(d.passage)}</div>`:''}
    ${d.qtext?`<div class="dbqt" style="${pre}"><b>Q.</b> ${esc(d.qtext)}</div>`:''}
    ${d.st1?`<div class="dbqt" style="${pre}"><b>Statement 1:</b> ${esc(d.st1)}</div>`:''}${d.st2?`<div class="dbqt" style="${pre}"><b>Statement 2:</b> ${esc(d.st2)}</div>`:''}
    ${dbLines(d.list1).length||dbLines(d.list2).length?`<div style="display:flex;gap:16px;flex-wrap:wrap;margin:8px 0">${list('List I',d.list1)}${list('List II',d.list2)}</div>`:''}
    ${opts}
    <div style="margin:6px 0"><button class="btn s ok" onclick="dbCheck('${d.id}')">${show?'Hide answer':'Check answer'}</button> <button class="btn s alt" onclick="dbRetry('${d.id}')">Try again</button></div>${sol}
    <div class="sub">${[d.topic?'Topic: '+esc(d.topic):'',d.difficulty?'Difficulty: L'+d.difficulty+' '+DB_DIFF[d.difficulty-1]:'',d.source?'Source: '+esc(d.source):'','Marks: +'+(d.marks??4)+' / −'+(d.neg??1),d.verified?'✔ Answer verified':'Not verified'].filter(Boolean).join(' · ')}</div></div>`;
}

function dbPick(id,k){const d=dbList().find(x=>x.id===id);if(!d||dbShow[id])return;let m=dbArr(d.mine);m=m.includes(k)?m.filter(x=>x!==k):dbMulti(d.qtype)?[...m,k].sort():[k];d.mine=m;delete d.checked;save();dbRefresh()}
function dbNum(id,val){const d=dbList().find(x=>x.id===id);if(d){d.numMine=val.trim();delete d.checked;save()}}
function dbCheck(id){const d=dbList().find(x=>x.id===id);if(!d)return;dbShow[id]=!dbShow[id];if(dbShow[id]){const r=dbResult(d);if(r&&r.s!=='skipped'){d.checked=today();save()}}dbRefresh()}
function dbRetry(id){const d=dbList().find(x=>x.id===id);if(!d)return;dbShow[id]=false;d.mine=[];d.numMine='';delete d.checked;save();dbRefresh()}
function dbStatsHtml(){
  const Q=dbList().filter(d=>d.qtype);if(!Q.length)return '';
  const A=Q.filter(d=>d.checked&&dbResult(d)),right=A.filter(d=>dbResult(d).s==='right').length,score=sum(A.map(d=>dbResult(d).score));
  const tab=(h,keys,of,name)=>{const rows=keys.map(k=>{const q=Q.filter(d=>of(d)===k);if(!q.length)return '';const a=q.filter(d=>d.checked&&dbResult(d)),ok=a.filter(d=>dbResult(d).s==='right').length;return `<tr><td>${esc(name(k))}</td><td>${q.length}</td><td>${a.length}</td><td>${a.length?r0(ok/a.length*100)+'%':'—'}</td></tr>`}).join('');return rows?`<div class="tw" style="margin-top:10px"><table><tr><th>${h}</th><th>Questions</th><th>Attempted</th><th>Accuracy</th></tr>${rows}</table></div>`:''};
  return `<div class="card"><h3>MCQ analysis</h3><div>${Q.length} questions · ${A.length} attempted · ${right} correct${A.length?' · accuracy '+r0(right/A.length*100)+'% · score '+score:''}</div>
    ${tab('Difficulty',[1,2,3,4,5,0],d=>+d.difficulty||0,k=>k?'L'+k+' '+DB_DIFF[k-1]:'Not set')}${tab('Type',DB_Q.map(x=>x[0]).filter(Boolean),d=>d.qtype,dbQName)}</div>`;
}

function dbQToggle(){
  const q=document.getElementById('dqt').value,box=document.getElementById('dbQ'),t=document.getElementById('dti');if(!box)return;
  box.style.display=q?'':'none';
  box.querySelectorAll('[data-q]').forEach(el=>{const l=el.dataset.q.split(' ');el.style.display=l.includes('all')||l.includes(q)?'':'none'});
  const vals=DB_ABC.map((k,i)=>document.getElementById('dop'+i).value.trim());
  if(q==='assertion_reason'&&vals.every(x=>!x))DB_AROPT.forEach((x,i)=>document.getElementById('dop'+i).value=x);
  else if(q!=='assertion_reason'&&DB_AROPT.every((x,i)=>vals[i]===x))DB_AROPT.forEach((x,i)=>document.getElementById('dop'+i).value='');
  if(t){t.required=!q;t.placeholder=q?'Optional: taken from the question if left blank':'e.g. Why does friction act forward on a rolling wheel?'}
}
// reads the MCQ part of the form into o; returns false (with a message) if something is missing
function dbQRead(o){
  const g=id=>document.getElementById(id).value.trim(),q=g('dqt');o.qtype=q;if(!q)return true;
  const num=q==='numerical',ar=q==='assertion_reason',match=q==='match_following'||q==='matrix_match';
  Object.assign(o,{passage:q==='paragraph'?g('dpa'):'',qtext:ar?'':g('dqx'),st1:ar?g('ds1'):'',st2:ar?g('ds2'):'',list1:match?dbLines(g('dl1')):[],list2:match?dbLines(g('dl2')):[],
    opts:num?[]:DB_ABC.map((k,i)=>g('dop'+i)),correct:num?[]:DB_ABC.filter((k,i)=>document.getElementById('dco'+i).checked),numAns:num?g('dna'):'',
    topic:g('dtp'),difficulty:+g('ddf')||'',source:g('dso'),expl:g('dex'),steps:dbLines(g('dsp')),marks:Math.max(0,+g('dmk')||0),neg:Math.max(0,+g('dng')||0),verified:document.getElementById('dvf').checked});
  while(o.opts.length&&!o.opts[o.opts.length-1])o.opts.pop();
  if(ar&&(!o.st1||!o.st2)){alert('Write both Statement 1 and Statement 2.');return false}
  if(!ar&&!o.qtext&&q!=='image'){alert('Write the question statement.');return false}
  if(!num){if(o.opts.filter(Boolean).length<2){alert('Add at least two options.');return false}
    if(o.correct.some(k=>!o.opts[DB_ABC.indexOf(k)])){alert('An option marked correct is empty.');return false}
    if(!dbMulti(q)&&o.correct.length>1){alert('Only one option can be correct for '+dbQName(q)+'.');return false}}
  return true;
}

  options:(d.opts||[]).map((t,i)=>({option_id:DB_ABC[i],text:t})).filter(x=>x.text),question_type:d.qtype,correct_options:num?[]:dbArr(d.correct),...(num?{numerical_answer:d.numAns}:{}),subject:d.subject==='Math'?'Mathematics':d.subject,chapter:d.area||'',topic:d.topic||'',difficulty:d.difficulty?'L'+d.difficulty:'',
  solution:{explanation:d.expl||'',steps:dbLines(d.steps)},source:d.source||'',marking:{correct:d.marks??4,negative:d.neg??1},verified:!!d.verified,images:(d.files||[]).map(f=>f.name)}}

function dbImport(text){
  let j;try{j=JSON.parse(text)}catch(e){return alert('That is not valid JSON.')}
  const arr=Array.isArray(j)?j:Array.isArray(j.questions)?j.questions:[j];let n=0,dup=0,bad=0;
  const str=x=>x==null?'':String(x).slice(0,4000);
  arr.slice(0,200).forEach(x=>{
    if(!x||typeof x!=='object'){bad++;return}
    const qs=typeof x.question==='string'?{text:x.question}:x.question||{},type=DB_Q.some(t=>t[0]&&t[0]===x.question_type)?x.question_type:(x.numerical_answer!=null?'numerical':'single_correct');
    const opts=[];(Array.isArray(x.options)?x.options:[]).forEach((o,i)=>{const k=DB_ABC.indexOf(String(o&&o.option_id||'').toUpperCase());opts[k>=0?k:i]=str(o&&typeof o==='object'?o.text:o)});
    for(let i=0;i<opts.length;i++)opts[i]=opts[i]||'';
    if(!qs.text&&!qs.statement_1){bad++;return}
    if(x.question_id&&dbList().some(d=>d.qid===x.question_id)){dup++;return}
    const diffs=String(x.difficulty||'').toLowerCase(),dn=+(diffs.match(/[1-5]/)||[])[0]||DB_DIFF.findIndex(y=>y.toLowerCase()===diffs)+1||'';
    const sj=/^math/i.test(x.subject||'')?'Math':dbSubj().includes(x.subject)?x.subject:'Other',sol=x.solution||{},mk=x.marking||{};
    dbList().push({id:dbNewId(),created:today(),files:[],answer:'',category:'Test question',status:'Open',priority:'Medium',subject:sj,area:str(x.chapter),title:(str(qs.text)||str(qs.statement_1)).replace(/\s+/g,' ').slice(0,80),desc:'',
      qid:/^MCQ-\d{1,9}$/.test(x.question_id||'')?x.question_id:dbQid(),qtype:type,qtext:str(qs.text),passage:str(qs.passage),st1:str(qs.statement_1),st2:str(qs.statement_2),list1:dbLines(qs.list_1),list2:dbLines(qs.list_2),opts:opts.slice(0,DB_ABC.length),correct:dbArr(x.correct_options),mine:[],numAns:str(x.numerical_answer),
      topic:str(x.topic),difficulty:dn,expl:str(sol.explanation),steps:dbLines(sol.steps),source:str(x.source),marks:mk.correct??4,neg:mk.negative??1,verified:x.verified===true});n++});
  if(n){save();dbF.st='all';vDoubts()}
  alert(`Imported ${n} question${n===1?'':'s'}.`+(dup?` ${dup} skipped (same question ID).`:'')+(bad?` ${bad} could not be read.`:''));
}

async function dbHydrate(){
  const L=dbList(),all=L.flatMap(d=>d.files||[]);
  document.querySelectorAll('#app img[data-fid]').forEach(async el=>{
    const f=all.find(x=>x.id===el.dataset.fid);if(!f)return;
    const b=await dbBlob(f);
    if(b)el.src=URL.createObjectURL(b);else{const s=document.createElement('span');s.className='sub';s.textContent='Photo is on another device. Turn on sync there.';el.replaceWith(s)}
  });
  if(syncCfg())all.filter(f=>!f.cloud).forEach(f=>dbUpload(f));
}
async function dbOpen(fid){
  const f=dbList().flatMap(d=>d.files||[]).find(x=>x.id===fid);if(!f)return;
  const w=window.open('','_blank'),b=await dbBlob(f);
  if(!b){if(w)w.close();return alert('This file is on another device. Turn on sync there so it can be shared.')}
  const u=URL.createObjectURL(b);if(w)w.location=u;else{const a=document.createElement('a');a.href=u;a.download=f.name;a.click()}
}
async function dbLight(fid){

async function dbSave(e){

  const o={subject:v('dsu'),area:v('dar'),category:v('dca'),priority:v('dpr'),title:v('dti').trim(),desc:document.getElementById('dde').value.trim(),status:st};
  if(!dbQRead(o))return;
  if(o.qtype&&!o.title)o.title=(o.qtext||o.st1||dbQName(o.qtype)).replace(/\s+/g,' ').slice(0,80);
  if(!o.title)return;
  const d=old||{id:dbNewId(),created:today(),files:[],answer:''};
  if(!o.qtype)['qid','qtype','passage','qtext','st1','st2','list1','list2','opts','correct','mine','numAns','numMine','topic','difficulty','source','expl','steps','marks','neg','verified','checked'].forEach(k=>delete d[k]);
  else{if(!d.qid)o.qid=dbQid();if(!Array.isArray(d.mine))o.mine=[];if(old){o.mine=[];o.numMine='';delete d.checked;dbShow[d.id]=false}}
  Object.assign(d,o);if(st==='Resolved'&&!d.resolved)d.resolved=today();if(st!=='Resolved')delete d.resolved;
  if(!old)L.push(d);
  const fi=document.getElementById('dfi');if(fi&&fi.files.length)await dbAttach(fi.files,d);
  dbEdit=null;save();vDoubts();
}
async function dbAddTo(inp){const d=dbList().find(x=>x.id===dbTarget);if(d&&inp.files.length){await dbAttach(inp.files,d);save();vDoubts()}inp.value=''}

function dbStatus(id,s){const d=dbList().find(x=>x.id===id);if(!d)return;d.status=s;if(s==='Resolved'){if(!d.resolved)d.resolved=today()}else delete d.resolved;save();vDoubts()}
function dbDup(id){const d=dbList().find(x=>x.id===id);if(!d)return;const c={...d,id:dbNewId(),title:d.title+' (copy)',created:today(),files:[],status:'Open'};delete c.resolved;delete c.checked;if(c.qtype){c.qid=dbQid();c.mine=[];c.numMine=''}dbList().push(c);save();vDoubts()}

let wlHours=null,wlWhat={from:'',to:'',h:1};
const WL_W={B:0.25,U:0.20,T:0.20,D:0.20,G:0.15},PRIO_MUL={High:1.3,Normal:1,Low:0.7},WK_H={High:2,Medium:1.5,Low:1};
function wlCompute(H){
  const t=today(),SJ=PCM(),prio=S.settings.subjPrio||{},hrs=hoursBy(addD(t,-13),t),tot=sum(SJ.map(s=>hrs[s]));
  const weekAvail=sum([1,2,3,4,5,6,7].map(i=>planMin(addD(t,i))/60));
  const rows=SJ.map(s=>{
    const Bh=blHours(s),Dh=sum((S.weakTopics||[]).filter(x=>x.subject===s&&x.status!=='Mastered').map(x=>WK_H[x.priority]||1.5));
    const cs=(S.commitments||[]).filter(c=>(c.subject===s||c.subject==='General'&&SJ.length===1)&&(c.status==='Active'&&c.deadline<=addD(t,3)||c.status==='Missed'&&(c.progress||0)<100));
    const Uh=sum(cs.map(cmRem)),ts=(S.commitments||[]).filter(c=>c.status==='Active'&&c.category==='Academic'&&c.subject===s&&c.deadline>=t&&c.deadline<=addD(t,14)).map(c=>diff(t,c.deadline));
    const T=ts.length?(Math.min(...ts)<=3?100:Math.min(...ts)<=7?70:40):0,target=100/SJ.length*(PRIO_MUL[prio[s]||'Normal']||1);
    const share=tot>0?hrs[s]/tot*100:100/SJ.length,Bn=Math.min(100,Bh/20*100),Un=Math.min(100,Uh/Math.max(2,weekAvail/3)*100),Dn=Math.min(100,Dh/12*100),Gn=Math.max(0,Math.min(100,(target-share)/target*100));
    const score=(WL_W.B*Bn+WL_W.U*Un+WL_W.T*T+WL_W.D*Dn+WL_W.G*Gn)*(PRIO_MUL[prio[s]||'Normal']||1);
    const debt=sum((S.commitments||[]).filter(c=>c.subject===s&&c.status==='Missed'&&(c.progress||0)<100).map(cmRem))+sum((S.backlog||[]).filter(b=>b.status!=='Resolved'&&diff(b.date,t)>SLA[b.priority]&&subjParts(b.subject).includes(s)).map(b=>(BL_H[b.priority]||2)/subjParts(b.subject).length));
    return {s,Bh,Dh,Uh,T,share,B:Bn,U:Un,D:Dn,G:Gn,score,debt,hours:hrs[s]};
  });
  const n=rows.length,floor=0.15*H,rest=Math.max(0,H-floor*n),sc=sum(rows.map(r=>r.score+1));
  rows.forEach(r=>{r.alloc=Math.round((floor+rest*(r.score+1)/sc)*2)/2});
  const diffH=H-sum(rows.map(r=>r.alloc));if(rows.length)rows.sort((a,b)=>b.score-a.score)[0].alloc+=diffH;rows.sort((a,b)=>PCM().indexOf(a.s)-PCM().indexOf(b.s));
  const testSoon=rows.some(r=>r.T>=70),dem=avg(rows.map(r=>r.D)),mix={lectures:45,practice:30,revision:20,review:5};
  if(testSoon){mix.practice+=10;mix.lectures-=10}if(dem>=60){mix.revision+=5;mix.lectures-=5}
  return {rows,mix,weekAvail,hrs,tot};
}

/* ---------- REALITY CHECK ---------- */
let rcRange=7;
function rcData(){
  const t=today(),f0=addD(t,-(rcRange-1)),first=firstAct(),f=f0>first?f0:first,days=diff(f,t)+1;let ph=0;for(let d=f;d<=t;d=addD(d,1))ph+=planMin(d)/60;
  const ah=totalH(f,t),qt=(S.settings.weeklyMin||0)/7*days,qa=qBetween(f,t),cm=(S.commitments||[]).filter(c=>c.deadline>=f&&c.deadline<=t&&['Completed','Missed'].includes(c.status)),done=cm.filter(c=>c.status==='Completed'),ontime=done.filter(c=>(c.completedOn||t)<=c.deadline);
  const ratios=[];if(sesAll().length)ratios.push(Math.min(1,ah/Math.max(0.1,ph)));if(qt>0&&qa>0||Object.keys(S.logs||{}).length)ratios.push(Math.min(1,qa/Math.max(1,qt)));
  const P=ratios.length?avg(ratios):null,C=cm.length?done.length/cm.length:(cmMetrics().crs!=null?cmMetrics().crs/100:null),T=done.length?ontime.length/done.length:null;
  let R=null;try{const cf=coachFacts();if(cf.latest&&cf.exp)R=Math.min(1,cf.latest.marks/cf.exp)}catch(e){}
  const wts=S.settings.easW||{P:0.30,C:0.25,T:0.25,R:0.20},parts=[['P',P],['C',C],['T',T],['R',R]].filter(x=>x[1]!=null),ws=sum(parts.map(x=>wts[x[0]]));
  const eas=parts.length?sum(parts.map(x=>wts[x[0]]*x[1]))/ws*100:null;
  const dev=[];for(let d=f;d<=t;d=addD(d,1)){const p=planMin(d)/60,a=totalH(d,d);if(p>0&&a>0)dev.push(Math.abs(a-p)/p)}
  return {t,f,days,ph,ah,qt,qa,cm,done,ontime,P,C,T,R,eas,pa:dev.length?Math.max(0,100-avg(dev)*100):null};
}
function rcFindings(D){

  if(D.ph>0&&sesAll().length&&D.ah<D.ph*0.7)add(2,'Study time is well below plan',`${r1(D.ah)} h logged against ${r1(D.ph)} h planned (${r0(D.ah/D.ph*100)}%).`,'Recalculate the daily plan from your last 4 weeks of actual hours.');
  if(D.qt>0&&D.qa<D.qt*0.7)add(2,'Question target not being met',`${D.qa} questions against a target of ${r0(D.qt)} for this period.`,'Lower the daily question target to what you reach on a normal day, then build up.');

function prodHours(P){

    while(left>0){const h=Math.floor(s/60)%24,o=Math.min(left,60-(s%60));mn[h]+=o;if(x.q!=null&&x.q!==''){q[h]+=(+x.q)*o/x.m;qm[h]+=o}if(x.focus!=null&&x.focus!==''){fs[h]+=(+x.focus)*o;fw[h]+=o}s+=o;left-=o}});
